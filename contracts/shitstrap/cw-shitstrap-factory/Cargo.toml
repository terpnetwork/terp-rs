[package]
name ="cw-shitstrap-factory"
version = "0.1.0"
authors = ["Jake Hartnell"]
description = "A CosmWasm factory contract for instantiating a payroll contract."
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# use library feature to disable all instantiate/execute/query exports
library = []
interface = ["dep:cw-orch"]

[dependencies]
cw-orch = { workspace = true, optional = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cosmwasm-schema = { workspace = true }
cw-shitstrap = { workspace = true, features = ["library"] }
cw-shit-denom  = { workspace = true }
cw-ownable = { workspace = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
cw20 = { workspace = true }
thiserror = { workspace = true }
cw-utils = { workspace = true }

[dev-dependencies]
cw-multi-test = { workspace = true }
cw20-base = { workspace = true, features = ["library"] }