[package]
name = "terp-recovery"
description = "Break-glass recovery authenticator with pluggable rehash algorithms"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []
# Host `proof_instance_verify` for [`crate::proof`]. Off by default: stub proofs fail closed.
zk-host = []

[dependencies]
blake2 = { workspace = true }
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
hex = { workspace = true, features = ["alloc"] }
serde = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
terp-account = { workspace = true }
terp-auth = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
hex = { workspace = true, features = ["std"] }
