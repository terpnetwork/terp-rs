[package]
name = "terp-dregg"
description = "Smart-account authenticator gated on dregg federation LC settlement head (dual-use with cw-ics08-wasm-dregg)"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
# Shared B2 types + pack_lanes (library feature avoids double entry points)
cw-ics08-wasm-dregg = { workspace = true, features = ["library", "mock-verify"] }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
serde = { workspace = true }
terp-account = { workspace = true }
terp-auth = { workspace = true }
thiserror = { workspace = true }
