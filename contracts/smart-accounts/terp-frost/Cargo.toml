[package]
name = "terp-frost"
description = "FROST group-vk contract: execute rotates the key; sudo Authenticate verifies a Schnorr signature and does not write"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
osst = { workspace = true, features = ["secp256k1"] }
serde = { workspace = true }
sha2 = { workspace = true }
terp-account = { workspace = true }
terp-auth = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
rand08 = { workspace = true }
