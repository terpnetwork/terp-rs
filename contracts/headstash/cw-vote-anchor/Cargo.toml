# P0 anchor registry — session root map only (no depth-24 append).
[package]
name = "cw-vote-anchor"
version = "0.1.0"
edition = "2024"
description = "Vote commitment tree P0 on-chain anchor registry (session, height → root[32])"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true }
cw-storage-plus = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
