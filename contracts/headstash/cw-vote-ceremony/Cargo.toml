[package]
name = "cw-vote-ceremony"
version = "0.1.0"
edition = "2024"
description = "DAO ceremony module: nullifier SSOT + ceremony lifecycle for vote-sdk-on-Terp"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
# zk proposal tests: real FROST-Ed25519 tally key + RedPallas r_vpk signer (workspace deps).
frost-ed25519 = { workspace = true, features = ["std"] }
rand08 = { workspace = true }
rand010 = { workspace = true, features = ["std_rng"] }
reddsa = { workspace = true, features = ["pallas-pasta"] }
