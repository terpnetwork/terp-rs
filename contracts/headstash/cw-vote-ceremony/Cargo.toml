[package]
name = "cw-vote-ceremony"
version = "0.1.0"
edition = "2021"
description = "DAO ceremony module: nullifier SSOT + ceremony lifecycle for vote-sdk-on-Terp"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
# No `zk`: stock wasmd does not export proof_instance_verify.
cosmwasm-std = { workspace = true }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
