[package]
name = "cw-cashu-registry"
version = "0.1.0"
edition = "2024"
description = "Canonical on-chain discovery registry for Cashu mint URLs + metadata (not an endorsement list)"
license = "Apache-2.0"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
hex = { workspace = true, features = ["std"] }
schemars = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
