[package]
name = "cw-lc-rotation"
version = "0.0.1"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Light-client committee epochs: dynamic weighted FROST/threshold committee derived from the cw-lc-registry operator set, rotated on rotate-shard, liveness fault or equivocation. Label family terp/lc/rotation."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["hash-blake", "cosmwasm_2_0"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
cw-lc-registry = { workspace = true, features = ["library"] }
# Committee key wire formats (FE01 FROST group key / TC01 threshold roster).
# No `lab` / `frost` features: decode only, signatures verified via host imports.
frost_escrow = { path = "../../../crates/frost_escrow", default-features = false }
threshold_committee = { path = "../../../crates/threshold_committee", default-features = false }
hex = { workspace = true, features = ["std"] }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
