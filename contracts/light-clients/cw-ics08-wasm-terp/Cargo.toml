[package]
name = "cw-ics08-wasm-terp"
version = "0.1.0"
edition = { workspace = true }
repository = { workspace = true }
description = "08-wasm light client for Terp hybrid IAVL (SHA-256 IBC + BLAKE3 app stores)"

[features]
default = []
# DIY IAVL + wrong-alg membership cross-check (benches / lab extras).
bench = ["terp-iavl-lc/bench"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["std", "cosmwasm_3_0"] }
cw2 = { workspace = true }
cw-storage-plus = { workspace = true }
hex = { workspace = true }
ics23 = { path = "../../../../ics23/rust", default-features = false }
prost = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
terp-iavl-lc = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
