[package]
name = "cw-lc-zcash"
version = "0.0.1"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Zcash IBC v2 light client (terp/lc/client): binds a registry client + aggregator, serves zakura node state / headers, and verifies zap-1 payment inclusion against committee-attested payment roots."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["hash-blake", "cosmwasm_2_0"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
cw-lc-registry = { workspace = true, features = ["library"] }
cw-lc-aggregator = { path = "../cw-lc-aggregator", features = ["library"] }
# zap-1 leaf / Merkle path / app_data_hash binding: reuse the existing client's verifier.
cw-ics08-wasm-zap1 = { workspace = true, features = ["library"] }
hex = { workspace = true, features = ["std"] }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
cw-multi-test = { workspace = true }
cw-lc-rotation = { path = "../cw-lc-rotation", features = ["library"] }
ed25519-dalek = { workspace = true }
frost_escrow = { path = "../../../crates/frost_escrow" }
zap1-verify = { workspace = true }
# Gas baselines (`tests/vm_gas.rs`, #[ignore]): meter optimized wasm in the VM.
cosmwasm-vm = { workspace = true, features = ["iterator", "staking", "stargate", "zk", "bn254", "hash-blake", "hash-poseidon", "redpallas"] }
threshold_committee = { path = "../../../crates/threshold_committee" }
cw-private-dex = { workspace = true, features = ["library"] }
