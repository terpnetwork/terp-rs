[package]
name = "cw-lc-aggregator"
version = "0.0.1"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Light-client header aggregator: proactive committee preconfirmations (FROST/threshold group signature per block), equivocation evidence, liveness, and k-of-n registry fallback. Label family terp/lc/aggregator."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["hash-blake", "cosmwasm_2_0"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
cw-lc-registry = { workspace = true, features = ["library"] }
cw-lc-rotation = { path = "../cw-lc-rotation", features = ["library"] }
hex = { workspace = true, features = ["std"] }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
cw-multi-test = { workspace = true }
ed25519-dalek = { workspace = true }
frost_escrow = { path = "../../../crates/frost_escrow" }
threshold_committee = { path = "../../../crates/threshold_committee" }
