[package]
name = "cw-zk-verify-demo"
description = "Primitive CosmWasm contract that egresses Path A proof_instance_verify for circuit demos"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
library = []
# Host Path A: deps.api.proof_instance_verify
zk-host = ["cosmwasm-std/zk"]

[dependencies]
cosmwasm-std = { workspace = true, features = ["std"] }
cosmwasm-schema = { workspace = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
