[package]
name = "cw-oracle-registry"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "Permissionless Osmosis TWAP / price-bound registry. Bounds only; never mints."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
# ibc2 gates Ibc2Msg. zk is the 4.0.0-zk math and curve set.
cosmwasm-std = { workspace = true, features = ["ibc2", "zk"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
