[package]
name = "cw-dex-quote-fixture"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
description = "IBC v2 counterparty that answers port dex-quote with one posted position."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["ibc2", "zk"] }
cw-oracle-registry = { path = "../oracle-registry", default-features = false }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
