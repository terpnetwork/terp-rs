[package]
name = "loyalty-verifier"
version = "0.1.0"
edition = "2021"
description = "CosmWasm contract that stores Merkle roots and verifies inclusion proofs for loyalty rewards claims"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
# hex::encode / hex::decode need std. The workspace pin is default-features = false.
hex = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
