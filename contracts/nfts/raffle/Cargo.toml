[package]
name = "nftfi-raffle"
version = { workspace = true }
edition = { workspace = true }
license = "Apache-2.0"
publish = false
description = "NFT raffle ported from Atlas app-contracts onto workspace CosmWasm"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "schema"
path = "src/bin/schema.rs"
doc = false

[features]
default = ["interface"]
library = []
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
cw2 = { workspace = true }
cw721 = { workspace = true }
nftfi-randomness = { workspace = true }
nftfi-utils = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
cw-multi-test = { workspace = true }
cw721 = { workspace = true }
cw721-svg = { workspace = true }
nftfi-loan = { workspace = true }
nftfi-randomness = { workspace = true }
nftfi-utils = { workspace = true, features = ["testing"] }
