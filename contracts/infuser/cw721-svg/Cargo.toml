[package]
name = "cw721-svg"
version = "0.1.0"
authors = ["hard-nett <hardnettt@proton.me>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
interface = ["cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-orch = { workspace = true, optional = true }
cw-ownable = { workspace = true }
cw-storage-plus = { workspace = true }
cw-svg = { workspace = true }
cw-svg-pack = { workspace = true }
cw-utils = { workspace = true }
cw2 = { workspace = true }
cw721 = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
terp-oracle = { workspace = true }
thiserror = { workspace = true }
whitelist-mtree = { workspace = true, features = ["library"] }

[dev-dependencies]
cw-multi-test = { workspace = true }
cw-oracle-registry = { workspace = true, features = ["library"] }

