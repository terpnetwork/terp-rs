[package]
name = "svg-auction"
version = "0.1.0"
edition = "2024"
description = "Minimal NFT escrow market for cw721-svg collections: buy-now listings and timed auctions. Message shapes follow terp-marketplace-utils (crates/marketplace)."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["interface"]
library = []
# cw-orch interface. Host only, gated out of the wasm32 guest in lib.rs.
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# zap-1 leaf of the bid memo, checked against the payment client's inclusion.
zap1-verify = { workspace = true }

[dev-dependencies]
# Real FROST-Ed25519 DKG + signing for private-auction tests (workspace deps, no new crates).
frost-ed25519 = { workspace = true, features = ["std"] }
rand08 = { workspace = true }
# Gas baselines on the optimized wasm (src/private_tests/vm_gas.rs, #[ignore]).
cosmwasm-vm = { workspace = true, features = ["iterator", "staking", "stargate", "zk", "bn254", "hash-blake", "hash-poseidon", "redpallas"] }
