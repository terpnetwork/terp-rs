[package]
name = "svg-auction"
version = "0.1.0"
edition = "2024"
description = "Minimal NFT escrow market for cw721-svg collections: buy-now listings and timed auctions. Message shapes follow terp-marketplace-utils (crates/marketplace)."

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["interface"]
library = []
# cw-orch interface. Host only, gated out of the wasm32 guest in lib.rs.
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-orch = { workspace = true, optional = true }
cw-storage-plus = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
