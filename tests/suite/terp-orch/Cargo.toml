[package]
name = "terp-orch"
description = "Unified cw-orch / ict-rs test suite: Path A circuits, private-bridge, optional auth"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

# The gov bin is cfg-gated. Without required-features, `cargo test --features headstash`
# still tries to compile it and fails with `cannot find gov`.
[[bin]]
name = "terp_gov_proposal"
path = "src/bin/terp_gov_proposal.rs"
required-features = ["gov"]

[features]
default = ["zk-host", "bridge"]
zk-host = [
    "cw-zk-verify-demo/zk-host",
    "cw-zk-verify-demo/library",
    "cosmwasm-std/zk",
    "cw-orch/zk",
    "dep:zk-cosmwasm",
]
bridge = [
    "zk-host",
    "dep:cw-private-dex",
    "cw-private-dex/interface",
    "cw-private-dex/library",
    "cw-private-dex/zk-api",
]
auth = ["dep:terp-authenticator-suite"]
ict = ["dep:ict-rs-cw-orch", "dep:ict-rs"]
# Product A clearnet claim (fresh Halo2 + proof_instance_verify). Slow K=18.
headstash = ["dep:cw-headstash", "dep:zk-headstash", "dep:rand", "zk-host"]
# Every published artifact: accounts, light clients, and the product contracts.
stack = [
    "dep:terp-authenticator-suite",
    "dep:terp-dao",
    "dep:terp-dregg",
    "dep:terp-frost",
    "dep:terp-bls",
    "dep:terp-zktls",
    "dep:polytone-any-proxy",
    "dep:cw-ics08-wasm-crosslink",
    "dep:cw-ics08-wasm-dregg",
    "dep:cw-ics08-wasm-terp",
    "dep:cw-ics08-wasm-zap1",
    "dep:crosslink-light-client",
    "dep:cw-shitstrap",
    "dep:cw-shitstrap-factory",
    "dep:cw-shit-denom",
    "dep:nftfi-raffle",
    "dep:nftfi-randomness",
    "dep:nftfi-loan",
    "dep:revenue-marketplace",
    "dep:revenue-reserve-auction",
    "dep:terp-bounty-escrow",
    "dep:cw420",
    "dep:cw-ave",
    "dep:cw-ave-factory",
    "dep:cw-headstash",
    "dep:cw-headstash-manifold",
    "dep:cw-norick",
    "dep:cw-nullifier-auth",
    "dep:cw-nullifier-gate",
    "dep:cw-vote-anchor",
    "dep:cw-vote-ceremony",
    "dep:cw-reg-eligibility",
    "dep:svg-auction",
    "dep:cw-oracle-aggregator",
    "dep:cw-oracle-twap-probe",
    "dep:marketplace-mirror",
    "dep:loyalty-verifier",
    "dep:trusted-builder-sbt",
    "dep:cw-cashu-registry",
    "dep:hm-nft-minter",
    "dep:hm-loyalty-whitelist",
    "dep:hm-nft-oracle",
    "dep:cosmwasm-vm",
]

[dependencies]
anyhow = { workspace = true }
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cosmwasm-vm = { workspace = true, optional = true, features = ["iterator", "staking", "stargate", "zk", "bn254", "hash-blake", "hash-poseidon", "redpallas"] }
crosslink-light-client = { workspace = true, optional = true }
cw-ave = { workspace = true, optional = true, features = ["library"] }
cw-ave-factory = { workspace = true, optional = true, features = ["library"] }
cw-cashu-registry = { workspace = true, optional = true, features = ["library", "interface"] }
cw-headstash = { workspace = true, optional = true, features = ["interface", "library", "zk-api"] }
cw-headstash-manifold = { workspace = true, optional = true, features = ["library"] }
cw-ics08-wasm-crosslink = { workspace = true, optional = true, features = ["library"] }
cw-ics08-wasm-dregg = { workspace = true, optional = true, features = ["library"] }
cw-ics08-wasm-terp = { workspace = true, optional = true, features = ["library"] }
cw-ics08-wasm-zap1 = { workspace = true, optional = true, features = ["library"] }
cw-norick = { workspace = true, optional = true, features = ["library"] }
cw-nullifier-auth = { workspace = true, optional = true, features = ["library"] }
cw-nullifier-gate = { workspace = true, optional = true, features = ["library"] }
cw-oracle-aggregator = { workspace = true, optional = true, features = ["library", "interface"] }
cw-oracle-twap-probe = { workspace = true, optional = true, features = ["library", "interface"] }
cw-orch = { workspace = true }
cw-private-dex = { workspace = true, optional = true }
cw-reg-eligibility = { workspace = true, optional = true, features = ["library"] }
cw-shit-denom = { workspace = true, optional = true }
cw-shitstrap = { workspace = true, optional = true, features = ["library"] }
cw-shitstrap-factory = { workspace = true, optional = true, features = ["library"] }
cw-vote-anchor = { workspace = true, optional = true, features = ["library"] }
cw-vote-ceremony = { workspace = true, optional = true, features = ["library"] }
cw-zk-verify-demo = { workspace = true, features = ["library"] }
cw420 = { workspace = true, optional = true, features = ["library"] }
hm-loyalty-whitelist = { workspace = true, optional = true }
hm-nft-minter = { workspace = true, optional = true, features = ["library", "interface"] }
hm-nft-oracle = { workspace = true, optional = true }
ict-rs = { workspace = true, optional = true, features = ["docker", "terp", "testing"] }
ict-rs-cw-orch = { workspace = true, optional = true }
loyalty-verifier = { workspace = true, optional = true, features = ["library", "interface"] }
marketplace-mirror = { workspace = true, optional = true, features = ["library", "interface"] }
nftfi-loan = { workspace = true, optional = true, features = ["library", "interface"] }
nftfi-raffle = { workspace = true, optional = true, features = ["library", "interface"] }
nftfi-randomness = { workspace = true, optional = true }
polytone-any-proxy = { workspace = true, optional = true, features = ["library"] }
rand = { version = "0.10", optional = true, features = ["std", "sys_rng"] }
revenue-marketplace = { workspace = true, optional = true, features = ["library"] }
revenue-reserve-auction = { workspace = true, optional = true, features = ["library"] }
serde = { workspace = true }
serde_json = { workspace = true }
svg-auction = { workspace = true, optional = true, features = ["library"] }
terp-authenticator-suite = { workspace = true, optional = true }
terp-bls = { workspace = true, optional = true, features = ["library"] }
terp-bounty-escrow = { workspace = true, optional = true, features = ["library", "interface", "dev-chain-guard"] }
terp-dao = { workspace = true, optional = true, features = ["library"] }
terp-dregg = { workspace = true, optional = true, features = ["library"] }
terp-frost = { workspace = true, optional = true, features = ["library"] }
terp-zktls = { workspace = true, optional = true, features = ["library"] }
trusted-builder-sbt = { workspace = true, optional = true, features = ["library", "interface"] }
zk-cosmwasm = { workspace = true, optional = true }
zk-headstash = { workspace = true, optional = true, features = ["interface", "host-crypto", "multicore"] }

[dev-dependencies]
hex = { workspace = true, features = ["std"] }
