revenue-reserve-auction = { workspace = true, optional = true, features = ["library"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true, features = ["std"] }
svg-auction = { workspace = true, optional = true, features = ["library", "interface"] }
terp-account = { workspace = true, optional = true, features = ["full", "interface"] }
terp-authenticator-suite = { workspace = true, optional = true }
terp-bls = { workspace = true, optional = true, features = ["library"] }
terp-seams = { workspace = true, optional = true, features = ["dex"] }
terp-bounty-escrow = { workspace = true, optional = true, features = ["library", "interface", "dev-chain-guard"] }
terp-dao = { workspace = true, optional = true, features = ["library"] }
terp-dregg = { workspace = true, optional = true, features = ["library"] }
terp-frost = { workspace = true, optional = true, features = ["library"] }
terp-zktls = { workspace = true, optional = true, features = ["library"] }
threshold_committee = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread"] }
terp721-account = { workspace = true, optional = true }
terp721-account-manifold = { workspace = true, optional = true, features = ["interface"] }
trusted-builder-sbt = { workspace = true, optional = true, features = ["library", "interface"] }
whitelist-mtree = { workspace = true, optional = true, features = ["interface"] }
zk-cosmwasm = { workspace = true, optional = true }
