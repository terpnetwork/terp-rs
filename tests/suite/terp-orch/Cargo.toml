[dev-dependencies]
# Gas baselines on optimized wasm (tests/privacy_bench.rs, #[ignore]).
cosmwasm-vm = { workspace = true, features = ["iterator", "staking", "stargate", "zk", "bn254", "hash-blake", "hash-poseidon", "redpallas"] }
# Wire-compat check of svg-auction's payment-client mirror (suites/privacy/bid_view.rs).
cw-lc-zcash = { path = "../../../contracts/light-clients/cw-lc-zcash", features = ["library"] }
hex = { workspace = true, features = ["std"] }

[[example]]
name = "fiab_grpc_repro"
required-features = ["gov"]
