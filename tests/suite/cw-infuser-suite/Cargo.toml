[package]
name = "cw-infuser-suite"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []
default = []
vanilla = []

[dependencies]
anyhow = { workspace = true }
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-infuser = { workspace = true, features = ["interface"] }
cw-infuser-scripts = { workspace = true }
cw-infusions = { workspace = true }
cw-orch = { workspace = true, features = ["daemon"] }
cw-storage-plus = { workspace = true }
cw-svg = { workspace = true }
cw-utils = { workspace = true }
cw2 = { workspace = true }
cw721 = { workspace = true }
cw721-base = { workspace = true }
cw721-svg = { workspace = true, features = ["library","interface"] }
schemars = { workspace = true }
serde = { workspace = true }
whitelist-mtree = { workspace = true, features = ["library", "interface"] }

[dev-dependencies]
cw-multi-test = { workspace = true }
rand = "0.8.5"
rs_merkle = { workspace = true }

