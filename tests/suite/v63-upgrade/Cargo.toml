[package]
name = "terp-v63-upgrade"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dry-run or broadcast the morocco-1 v6.3 expedited software-upgrade"

# Own workspace so `cargo run` here does not load terp-rs (halo2 graph).
[workspace]

[[bin]]
name = "v63-upgrade"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cosmrs = { path = "../../../cosmos-rust/cosmrs" }
cw-orch-daemon = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "ec4d693aad80ee70ddbd77c3b78c9807bedb6be0" }
cw-orch-networks = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "ec4d693aad80ee70ddbd77c3b78c9807bedb6be0" }
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[patch."https://github.com/permissionlessweb/cw-orchestrator"]
cw-orch-daemon = { path = "../../../cw-orchestrator/cw-orch-daemon" }
cw-orch-networks = { path = "../../../cw-orchestrator/packages/cw-orch-networks" }

[patch.crates-io]
cosmwasm-std = { path = "../../../cosmwasm/packages/std" }
cosmwasm-schema = { path = "../../../cosmwasm/packages/schema" }
cosmwasm-schema-derive = { path = "../../../cosmwasm/packages/schema-derive" }
cosmwasm-core = { path = "../../../cosmwasm/packages/core" }
cosmwasm-crypto = { path = "../../../cosmwasm/packages/crypto" }
cosmwasm-derive = { path = "../../../cosmwasm/packages/derive" }
cw-schema = { path = "../../../cosmwasm/packages/cw-schema" }
cw-schema-derive = { path = "../../../cosmwasm/packages/cw-schema-derive" }
cw-storage-plus = { path = "../../../cw-storage-plus" }
