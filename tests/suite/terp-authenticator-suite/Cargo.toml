[package]
name = "terp-authenticator-suite"
description = "cw-orch deploy suite and Mock tests for Terp x/smart-account authenticators"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[[bin]]
name = "deploy-noncircuit-auth"
path = "src/bin/deploy_noncircuit_auth.rs"
required-features = ["daemon"]

[features]
default = []
daemon = ["cw-orch/daemon"]
daemon-e2e = ["daemon"]
vote-sdk = []
# Production zk-jwt path: deps.api.proof_instance_verify via cosmwasm-std/zk.
# Structural suite Authenticate positives must NOT run with this enabled unless a
# mock circuit is registered — use:
#   cargo test -p terp-zkjwt --features zk-host,library
#   cargo test -p terp-authenticator-suite --features zk-host --test zk_host
# Real snarkjs jwt-auth e2e also needs zk-cosmwasm bn254 (ark convert + verify):
#   cargo test -p terp-authenticator-suite --features zk-host --test zk_host jwt_auth
zk-host = ["terp-zkjwt/zk-host", "cosmwasm-std/zk", "dep:zk-cosmwasm", "zk-cosmwasm/bn254"]

[dependencies]
anyhow = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
cosmwasm-std = { workspace = true, features = ["std"] }
cosmwasm-schema = { workspace = true }
cw-orch = { workspace = true }
dotenvy = "0.15"
env_logger = "0.11"
serde = { workspace = true }
thiserror = { workspace = true }
terp-auth = { workspace = true }
terp-account = { workspace = true }
terp-zkjwt = { workspace = true, features = ["library"] }
terp-zkposiedon = { workspace = true, features = ["library"] }
terp-vsck = { workspace = true, features = ["library"] }
terp-passkey = { workspace = true, features = ["library"] }
terp-recovery = { workspace = true, features = ["library"] }
terp-ed25519 = { workspace = true, features = ["library"] }
terp-eth = { workspace = true, features = ["library"] }
terp-irl = { workspace = true, features = ["library"] }
# Optional: snarkjs→ark conversion for real jwt-auth e2e under zk-host
zk-cosmwasm = { path = "../../../../cosmwasm/packages/zk", optional = true, default-features = false }

[dev-dependencies]
hex = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
