[package]
name = "terp-ipa-params"
description = "No-op circuit + deterministic Vesta IPA Params::new(k) table (k=1..=20) for wasmvm zk_param/"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
halo2_proofs = { path = "../../../../zcash/halo2/halo2_proofs", default-features = false, features = ["batch", "multicore"] }
hex = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = "0.10"
