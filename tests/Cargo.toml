[package]
name = "terp-scripts"
version = "0.0.2"
edition = "2024"
description = "Terp Network orchestration, IBC data pipeline, and integration harness (path: tests/)"

[[bin]]
name = "delegations"
path = "bin/dels.rs"

[[bin]]
name = "e2e"
path = "bin/e2e.rs"

# Canonical IBC automation CLI (agent catalog / just recipes)
[[bin]]
name = "terp-ibc"
path = "bin/ibc_info.rs"

# Deprecated alias — prefer terp-ibc; remove after one release cycle
[[bin]]
name = "ibc"
path = "bin/ibc_info.rs"

[[bin]]
name = "testnet"
path = "bin/testnet.rs"

[[bin]]
name = "create_val"
path = "bin/create_val.rs"

[[bin]]
name = "polytone_migrate"
path = "bin/polytone_migrate.rs"

[[bin]]
name = "suite_coverage"
path = "bin/suite_coverage.rs"

[features]
default = ["docker", "nostr", "hash-market"]
docker = []
nostr = []
zk = ["cosmwasm-std/zk", "dep:zk-test-press"]
# Content plane + calendar NIP-52 egress (Phase B)
hash-market = ["dep:hash-market"]
# Billboards/account composite stays off. Path dep omitted so default
# cargo check is not forced to unify crates-io cosmwasm-crypto (=4.0.3)
# against in-tree cosmwasm-crypto (=4.2.0).
account = []
# VSCK + suite::auth re-exports. Full TerpAuthenticatorSuite stays optional
# (it pulls terp-zkjwt/halo2 and is parked for other authenticators).
auth-suite = ["dep:terp-vsck", "dep:terp-auth"]
auth-suite-full = ["auth-suite", "dep:terp-authenticator-suite"]
circuit-demo-suite = ["orch-suite"]
orch-suite = ["dep:terp-orch"]
# zebra-* need protoc; keep off default so --test no_rick does not require protobuf.
crosslink-e2e = ["dep:zebra-crosslink", "dep:zebra-chain"]
# Live zakurad TFL RPC → CrosslinkHeader (not synthetic ed25519).
zakura-live = ["ict-rs/zakura"]

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1.89"
axum = { workspace = true, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tower-log"] }
clap = { workspace = true, features = ["derive"] }
cosmos-sdk-proto = { workspace = true }
cosmrs = { workspace = true }
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true }
crosslink-light-client = { workspace = true }
csv = "1.4.0"
cw-ics08-wasm-crosslink = { workspace = true, features = ["interface"] }
cw-orch = { workspace = true, features = ["daemon"] }
cw-orch-interchain = { workspace = true, features = ["daemon"] }
cw-orch-polytone = { workspace = true }
dotenv = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
ed25519-zebra = { workspace = true }
env_logger = { workspace = true, features = ["default"] }
frost-ed25519 = { version = "2.2", default-features = false, features = ["std", "serialization"] }
halo2_proofs = { workspace = true, features = ["multicore"] }
hash-market = { workspace = true, optional = true, features = ["server", "client", "ve", "blossom", "nostr", "frost", "noise", "privval"] }
hex = { workspace = true, features = ["std"] }
ict-rs = { workspace = true, features = ["default", "docker", "terp", "testing", "nostr"] }
k256 = { workspace = true, features = ["ecdsa", "std"] }
kms-shard = { workspace = true }
log = "0.4.30"
prost = "0.13"
prost-types = "0.13"
rand = "0.8"
reqwest = { version = "0.13.4", features = ["json"] }
rustls = { workspace = true, features = ["ring", "std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
snow = "0.9"
tempfile = "3.27.0"
terp-auth = { workspace = true, optional = true }
terp-authenticator-suite = { workspace = true, optional = true }
terp-orch = { workspace = true, optional = true }
terp-rs = { workspace = true, features = ["default"] }
terp-vsck = { workspace = true, features = ["library"], optional = true }
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3.23"
which = "8.0.2"
zebra-chain = { workspace = true, optional = true }
zebra-crosslink = { workspace = true, optional = true }
zk-test-press = { workspace = true, optional = true, features = ["interface"] }

[dev-dependencies]
rand_core = "0.6.4"
