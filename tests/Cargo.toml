[package]
name = "terp-scripts"
version = "0.0.2"
edition = "2024"
description = "Terp Network orchestration, IBC data pipeline, and integration harness (path: tests/)"

# IBC, delegation, validator, and polytone CLIs live on `dao-scripts`.
# `e2e` and `testnet` bins were removed with their sources.

[[bin]]
name = "suite_coverage"
path = "bin/suite_coverage.rs"

[features]
default = ["docker", "nostr", "hash-market"]
docker = []
nostr = []
zk = ["cosmwasm-std/zk", "dep:zk-test-press"]
# Content plane + calendar NIP-52 egress (Phase B)
hash-market = ["dep:hash-market"]
# Billboards/account composite stays off. Path dep omitted so default
# cargo check is not forced to unify crates-io cosmwasm-crypto (=4.0.3)
# against in-tree cosmwasm-crypto (=4.2.0).
account = []
# VSCK + suite::auth re-exports. Full TerpAuthenticatorSuite stays optional
# (it pulls terp-zkjwt/halo2 and is parked for other authenticators).
auth-suite = ["dep:terp-vsck", "dep:terp-auth"]
auth-suite-full = ["auth-suite", "dep:terp-authenticator-suite"]
circuit-demo-suite = ["orch-suite"]
# One manifold: circuits, bridge, authenticators, accounts, light clients, products.
orch-suite = [
    "dep:terp-orch",
    "terp-orch/stack",
    "dep:cw-infuser",
    "dep:cw-infusions",
    "dep:cw-multi-test",
    "dep:cw-svg",
    "dep:cosmwasm-crypto",
    "dep:cw-ownable",
    "dep:cw721",
    "dep:cw721-base",
    "dep:cw721-svg",
    "dep:ecdsa",
    "dep:nftfi-loan",
    "dep:nftfi-raffle",
    "dep:nftfi-randomness",
    "dep:nftfi-utils",
    "dep:terp-beacon",
    "dep:rs_merkle",
    "dep:terp-account",
    "dep:terp-bounty-escrow",
    "dep:terp721-account",
    "dep:terp721-account-manifold",
    "dep:whitelist-mtree",
    "dep:cw-shitstrap",
    "dep:cw-shit-denom",
]
# zebra-* need protoc; keep off default so --test no_rick does not require protobuf.
crosslink-e2e = ["dep:zebra-crosslink", "dep:zebra-chain"]
# Live zakurad TFL RPC → CrosslinkHeader (not synthetic ed25519).
zakura-live = ["ict-rs/zakura"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["form", "http1", "json", "matched-path", "original-uri", "query", "tokio", "tower-log"] }
clap = { workspace = true, features = ["derive"] }
cosmos-sdk-proto = { workspace = true }
cosmrs = { workspace = true }
cosmwasm-crypto = { workspace = true, optional = true }
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true }
crosslink-light-client = { workspace = true }
csv = "1.4.0"
cw-ics08-wasm-crosslink = { workspace = true, features = ["interface"] }
cw-infuser = { workspace = true, optional = true, features = ["interface"] }
cw-infusions = { workspace = true, optional = true }
cw-multi-test = { workspace = true, optional = true }
cw-orch = { workspace = true, features = ["daemon"] }
cw-orch-interchain = { workspace = true, features = ["daemon"] }
cw-orch-polytone = { workspace = true }
cw-ownable = { workspace = true, optional = true }
cw-shit-denom = { workspace = true, optional = true }
cw-shitstrap = { workspace = true, optional = true, features = ["interface"] }
cw-svg = { workspace = true, optional = true }
cw721 = { workspace = true, optional = true }
cw721-base = { workspace = true, optional = true }
cw721-svg = { workspace = true, optional = true, features = ["interface"] }
dotenv = { workspace = true }
ecdsa = { workspace = true, optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
ed25519-zebra = { workspace = true }
env_logger = { workspace = true, features = ["default"] }
frost-ed25519 = { workspace = true, features = ["std", "serialization"] }
halo2_proofs = { workspace = true, features = ["multicore"] }
hash-market = { workspace = true, optional = true, features = ["server", "client", "ve", "blossom", "nostr", "frost", "noise", "privval"] }
hex = { workspace = true, features = ["std"] }
ict-rs = { workspace = true, features = ["default", "docker", "terp", "testing", "nostr"] }
k256 = { workspace = true, features = ["ecdsa", "std"] }
kms-shard = { workspace = true }
log = { workspace = true }
nftfi-loan = { workspace = true, optional = true, features = ["interface"] }
nftfi-raffle = { workspace = true, optional = true, features = ["interface"] }
nftfi-randomness = { workspace = true, optional = true }
nftfi-utils = { workspace = true, optional = true, features = ["svg"] }
terp-beacon = { workspace = true, optional = true, features = ["interface", "fixtures"] }
prost = { workspace = true, features = ["std"] }
prost-types = { workspace = true }
rand = "0.8"
reqwest = { version = "0.13.4", features = ["json"] }
rs_merkle = { workspace = true, optional = true, features = ["std"] }
rustls = { workspace = true, features = ["ring", "std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
snow = { workspace = true }
tempfile = { workspace = true }
terp-account = { workspace = true, optional = true, features = ["full"] }
terp-auth = { workspace = true, optional = true }
terp-authenticator-suite = { workspace = true, optional = true }
terp-bounty-escrow = { workspace = true, optional = true, features = ["interface"] }
terp-orch = { workspace = true, optional = true }
terp-rs = { workspace = true, features = ["default"] }
terp-vsck = { workspace = true, features = ["library"], optional = true }
terp721-account = { workspace = true, optional = true }
terp721-account-manifold = { workspace = true, optional = true, features = ["interface"] }
tokio = { workspace = true, features = ["full"] }
toml = "1.1.2"
tower = { workspace = true, features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
which = "8.0.2"
whitelist-mtree = { workspace = true, optional = true, features = ["interface"] }
zebra-chain = { workspace = true, optional = true }
zebra-crosslink = { workspace = true, optional = true }
zk-test-press = { workspace = true, optional = true, features = ["interface"] }

[dev-dependencies]
rand_core = "0.6.4"

[[test]]
name = "shitstraps_e2e"
required-features = ["orch-suite"]
