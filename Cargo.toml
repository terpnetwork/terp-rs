[workspace]
resolver = "2"
# Nested cargo projects with their own [workspace] tables.
exclude = ["tools/hash-market"]
members = [
    "crates/terp-auth",
    "crates/terp-account",
    "crates/crosslink/light-client",
    "crates/terp-seams",
    "contracts/revenue/private-dex",
    "crates/nips",
    "crates/sdk",
    "proto",
    "tests",
    "tools/gen-tools",
    "contracts/light-clients/cw-ics08-wasm-crosslink",
    "contracts/light-clients/cw-ics08-wasm-dregg",
    "contracts/light-clients/cw-ics08-wasm-zap1",
    "contracts/light-clients/cw-ics08-wasm-terp",
    "contracts/light-clients/terp-iavl-lc",
    "contracts/ibc/polytone-any-proxy",
    "tests/suite/terp-authenticator-suite",
    "tests/suite/terp-orch",
    "tests/suite/ipa-params",
    "contracts/zk/cw-zk-verify-demo",
    "contracts/smart-accounts/terp-dregg",
    "contracts/smart-accounts/terp-zkjwt",
    "contracts/smart-accounts/terp-zkposiedon",
    "contracts/smart-accounts/terp-vsck",
    "contracts/smart-accounts/terp-passkey",
    "contracts/smart-accounts/terp-recovery",
    "contracts/smart-accounts/terp-recovery-poseidon-demo",
    "contracts/smart-accounts/terp-ed25519",
    "contracts/smart-accounts/terp-eth",
    "contracts/smart-accounts/terp-irl",
    "contracts/smart-accounts/terp-frost",
    "contracts/smart-accounts/terp-zkpallas",
]

[workspace.package]
edition = "2024"
rust-version = "1.86"
version = "0.0.2"
authors = [""]
license = "Apache-2.0"
homepage = "https://terp.network"
repository = "https://github.com/terpnetwork/terp-rs"
documentation = "https://docs.terp.network"
keywords = ["cosmos", "ibc", "sp1", "tendermint", "ethereum", "bridge", "solidity", "eureka"]

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
hex = { version = "0.4", default-features = false }
thiserror = { version = "2.0", default-features = false }
schemars = "0.8"

ed25519-zebra = { version = "4.2", default-features = false }
rand = { version = "0.9", default-features = false }
rand08 = { package = "rand", version = "0.8", features = ["std", "std_rng"] }

cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }
cosmwasm-crypto = { path = "../cosmwasm/packages/crypto" }
crosslink-light-client = { path = "crates/crosslink/light-client", default-features = false }
cw-orch = { path = "../cw-orchestrator/cw-orch" }
cw2 = { path = "../cw-minus/packages/cw2" }
cw-storage-plus = { path = "../cw-storage-plus" }
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw-ownable = { path = "../cw-plus-plus/packages/ownable" }
cw-controllers = { path = "../cw-minus/packages/controllers" }
ibc-proto = { path = "../ibc-proto-rs", default-features = false }
prost = "0.14"
sha2 = { version = "0.10.8", default-features = false }
cw-multi-test = { package = "abstract-cw-multi-test", path = "../cw-multi-test-fork" }

terp-auth = { path = "crates/terp-auth" }
terp-account = { path = "crates/terp-account" }
# Integration/orchestration package (path tests/, crate name terp-scripts)
terp-scripts = { path = "tests" }

terp-zkjwt = { path = "contracts/smart-accounts/terp-zkjwt" }
terp-zkposiedon = { path = "contracts/smart-accounts/terp-zkposiedon" }
terp-vsck = { path = "contracts/smart-accounts/terp-vsck" }
terp-passkey = { path = "contracts/smart-accounts/terp-passkey" }
terp-recovery = { path = "contracts/smart-accounts/terp-recovery" }
terp-recovery-poseidon-demo = { path = "contracts/smart-accounts/terp-recovery-poseidon-demo" }
terp-ed25519 = { path = "contracts/smart-accounts/terp-ed25519" }
terp-eth = { path = "contracts/smart-accounts/terp-eth" }
terp-dregg = { path = "contracts/smart-accounts/terp-dregg" }
cw-ics08-wasm-dregg = { path = "contracts/light-clients/cw-ics08-wasm-dregg" }
cw-ics08-wasm-zap1 = { path = "contracts/light-clients/cw-ics08-wasm-zap1" }
terp-iavl-lc = { path = "contracts/light-clients/terp-iavl-lc" }
terp-seams = { path = "crates/terp-seams" }
terp-irl = { path = "contracts/smart-accounts/terp-irl" }
terp-zkpallas = { path = "contracts/smart-accounts/terp-zkpallas" }
cw-private-dex = { path = "contracts/revenue/private-dex" }

# Monorepo path patches — force git/crates.io CosmWasm stack onto local forks.
# Prevents re-resolve of abstract → cw-asset → permissionlessweb/cw-minus without cosmwasm-schema.

[patch.crates-io]
cosmwasm-core = { path = "../cosmwasm/packages/core" }
cosmwasm-crypto = { path = "../cosmwasm/packages/crypto" }
cosmwasm-derive = { path = "../cosmwasm/packages/derive" }
cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-schema-derive = { path = "../cosmwasm/packages/schema-derive" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }
cw-schema = { path = "../cosmwasm/packages/cw-schema" }
cw-schema-derive = { path = "../cosmwasm/packages/cw-schema-derive" }
cw-storage-plus = { path = "../cw-storage-plus" }
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw2 = { path = "../cw-minus/packages/cw2" }
cw-controllers = { path = "../cw-minus/packages/controllers" }

[patch."https://github.com/permissionlessweb/cosmwasm"]
cosmwasm-core = { path = "../cosmwasm/packages/core" }
cosmwasm-crypto = { path = "../cosmwasm/packages/crypto" }
cosmwasm-derive = { path = "../cosmwasm/packages/derive" }
cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
cosmwasm-schema-derive = { path = "../cosmwasm/packages/schema-derive" }
cosmwasm-std = { path = "../cosmwasm/packages/std" }
cw-schema = { path = "../cosmwasm/packages/cw-schema" }
cw-schema-derive = { path = "../cosmwasm/packages/cw-schema-derive" }

[patch."https://github.com/permissionlessweb/cw-minus"]
cw-controllers = { path = "../cw-minus/packages/controllers" }
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw2 = { path = "../cw-minus/packages/cw2" }

[patch."https://github.com/permissionlessweb/cw-plus"]
cw1 = { path = "../cw-plus/packages/cw1" }
cw20 = { path = "../cw-plus/packages/cw20" }
cw20-base = { path = "../cw-plus/contracts/cw20-base" }
cw20-ics20 = { path = "../cw-plus/contracts/cw20-ics20" }
cw3 = { path = "../cw-plus/packages/cw3" }
cw4 = { path = "../cw-plus/packages/cw4" }

[patch."https://github.com/permissionlessweb/cw-plus-plus"]
cw-address-like = { path = "../cw-plus-plus/packages/address-like" }
cw-ownable = { path = "../cw-plus-plus/packages/ownable" }
cw-paginate = { path = "../cw-plus-plus/packages/paginate" }

[patch."https://github.com/permissionlessweb/cw-asset"]
cw-asset = { path = "../cw-asset" }

[patch."https://github.com/permissionlessweb/cw-storage-plus"]
cw-storage-plus = { path = "../cw-storage-plus" }

[patch."https://github.com/permissionlessweb/cw-packages"]
cw-clearable = { path = "../cw-packages/cw-clearable" }
cw-blob = { path = "../cw-packages/contracts/cw-blob" }
