[workspace.package]
edition = "2024"
rust-version = "1.86"
version = "0.0.2"
authors = [""]
license = "Apache-2.0"
homepage = "https://terp.network"
repository = "https://github.com/terpnetwork/terp-rs"
documentation = "https://docs.terp.network"
keywords = ["cosmos", "ibc", "sp1", "tendermint", "ethereum", "bridge", "solidity", "eureka"]

[workspace.dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
hex = { version = "0.4", default-features = false }
thiserror = { version = "2.0", default-features = false }
schemars = "0.8"

ed25519-zebra = { version = "4.2", default-features = false }
rand = { version = "0.9", default-features = false }
rand08 = { package = "rand", version = "0.8", features = ["std", "std_rng"] }

cosmwasm-schema = { path = "../cosmwasm/packages/schema" }
# Guest baseline. `zk` is opt-in (`features = ["zk"]` or a crate feature that enables `cosmwasm-std/zk`).
# Cargo does not let a member disable features inherited from here.
cosmwasm-std = { path = "../cosmwasm/packages/std", default-features = false, features = ["exports", "iterator", "std"] }
cosmwasm-crypto = { path = "../cosmwasm/packages/crypto" }
crosslink-light-client = { path = "crates/crosslink/light-client", default-features = false }
# Pushed fork/cw3. The patch table below replaces this checkout (local HEAD is ahead of the remote).
cw-orch = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "ec4d693aad80ee70ddbd77c3b78c9807bedb6be0" }
cw-orch-interchain = { git = "https://github.com/permissionlessweb/cw-orchestrator", rev = "ec4d693aad80ee70ddbd77c3b78c9807bedb6be0" }
cw2 = { path = "../cw-minus/packages/cw2" }
cw-storage-plus = { path = "../cw-storage-plus" }
cw-utils = { path = "../cw-minus/packages/cw-utils" }
cw-ownable = { path = "../cw-plus-plus/packages/ownable" }
cw-controllers = { path = "../cw-minus/packages/controllers" }
ibc-proto = { path = "../ibc-proto-rs", default-features = false }
cosmos-sdk-proto = { path = "../cosmos-rust/cosmos-sdk-proto", default-features = false }
prost = { version = "0.14", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
cw-multi-test = { package = "abstract-cw-multi-test", path = "../cw-multi-test-fork" }

terp-auth = { path = "crates/terp-auth" }
terp-account = { path = "crates/terp-account" }
# Integration/orchestration package (path tests/, crate name terp-scripts)
terp-scripts = { path = "tests" }

terp-zkjwt = { path = "contracts/smart-accounts/terp-zkjwt" }
terp-vsck = { path = "contracts/smart-accounts/terp-vsck" }
terp-passkey = { path = "contracts/smart-accounts/terp-passkey" }
terp-recovery = { path = "contracts/smart-accounts/terp-recovery" }
terp-ed25519 = { path = "contracts/smart-accounts/terp-ed25519" }
terp-eth = { path = "contracts/smart-accounts/terp-eth" }
terp-dregg = { path = "contracts/smart-accounts/terp-dregg" }
cw-ics08-wasm-dregg = { path = "contracts/light-clients/cw-ics08-wasm-dregg" }
cw-ics08-wasm-zap1 = { path = "contracts/light-clients/cw-ics08-wasm-zap1" }
terp-iavl-lc = { path = "contracts/light-clients/terp-iavl-lc" }
terp-seams = { path = "crates/terp-seams" }
