[workspace.package]
edition = "2024"
rust-version = "1.86"
version = "0.0.2"
authors = [""]
license = "Apache-2.0"
homepage = "https://terp.network"
repository = "https://github.com/terpnetwork/terp-rs"
documentation = "https://docs.terp.network"
keywords = [
    "cosmos",
    "ibc",
    "sp1",
    "tendermint",
    "ethereum",
    "bridge",
