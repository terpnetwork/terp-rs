# Monorepo path patches — force git/crates.io CosmWasm stack onto local forks.
# Prevents re-resolve of abstract → cw-asset → permissionlessweb/cw-minus without cosmwasm-schema.

[patch.crates-io]
cosmwasm-core = { path = "../cosmwasm/packages/core" }
cosmwasm-crypto = { path = "../cosmwasm/packages/crypto" }
