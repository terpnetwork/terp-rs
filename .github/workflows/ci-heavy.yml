# Tier 2 — expensive. Docker harness, full-ish workspace, manual / nightly / labeled.
# Does NOT run on every PR. Requires maintainer action or schedule.
#
# Triggers:
#   - workflow_dispatch (repo write / admin via GitHub UI)
#   - schedule (weekly)
#   - pull_request labeled `ci-heavy`
#   - push to main (optional full gate — only harness job stays optional)
name: CI Heavy

on:
  workflow_dispatch:
    inputs:
      run_docker_harness:
        description: "Run Docker multihop IBC harness (slow, needs Docker)"
        type: boolean
        default: true
      run_workspace_check:
        description: "cargo check --workspace (compile all members)"
        type: boolean
        default: true
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  pull_request:
    types: [labeled]

concurrency:
  group: ci-heavy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ICT_MOCK: "0"
  # Repo root on GHA is terp-rs; local act sets GITHUB_WORKSPACE via scripts/ci.

jobs:
  authorize:
    name: authorize heavy tier
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.a.outputs.allowed }}
      docker: ${{ steps.a.outputs.docker }}
      workspace: ${{ steps.a.outputs.workspace }}
    steps:
      - id: a
        env:
          EVENT: ${{ github.event_name }}
          LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.actor }}
          IN_DOCKER: ${{ inputs.run_docker_harness }}
          IN_WS: ${{ inputs.run_workspace_check }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          allowed=false
          docker=false
          workspace=false

          case "$EVENT" in
            workflow_dispatch)
              allowed=true
              # inputs are strings "true"/"false" on dispatch
              docker="${IN_DOCKER:-true}"
              workspace="${IN_WS:-true}"
              ;;
            schedule)
              allowed=true
              docker=true
              workspace=true
              ;;
            pull_request)
              if [[ "$LABEL" == "ci-heavy" ]]; then
                allowed=true
                docker=true
                workspace=true
              fi
              # Fork PRs: do not run Docker heavy (untrusted code + no image secrets)
              if [[ -n "${PR_HEAD_REPO:-}" && "$PR_HEAD_REPO" != "$THIS_REPO" ]]; then
                allowed=false
                echo "refusing ci-heavy on fork PR from $PR_HEAD_REPO"
              fi
              ;;
          esac

          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "heavy authorize: allowed=$allowed docker=$docker workspace=$workspace actor=$ACTOR"

  workspace-check:
    name: cargo check workspace
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && needs.authorize.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: workspace-check
      - name: Workspace compile check
        run: cargo check --workspace --tests

  docker-harness:
    name: IBC multihop Docker harness
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && needs.authorize.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: docker-harness
      - uses: extractions/setup-just@v2
      - name: Docker available
        run: docker info
      - name: Multihop harness (ignored tests)
        # Image tags may need org secrets / pre-pulled images in a follow-up.
        # Fail closed so heavy CI is honest when harness is broken.
        run: just scripts-ibc-harness
        env:
          RUST_LOG: info
