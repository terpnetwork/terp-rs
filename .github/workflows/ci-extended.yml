# Tier 1 — path / label gated. Contracts + more crates when those paths change.
# Dense packing: 3 balanced contract packs + independent scripts-integration;
# optional zk heavy packs no longer wait on contracts-core (independent).
name: CI Extended

on:
  pull_request:
    paths:
      - "contracts/**"
      - "crates/**"
      - "tests/**"
      - "tools/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - "scripts/ci/**"
      - ".github/workflows/ci-extended.yml"
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  push:
    branches: [main, master]
    paths:
      - "contracts/**"
      - "crates/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/ci/**"
  workflow_dispatch:
    inputs:
      full_contracts:
        description: "Also run heavier authenticator/zk contract tests"
        type: boolean
        default: false

concurrency:
  group: ci-extended-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Repo root on GHA is terp-rs; local act sets GITHUB_WORKSPACE via scripts/ci.

jobs:
  # Skip draft PRs unless labeled ci-extended (saves minutes).
  should-run:
    name: decide
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.d.outputs.run }}
      heavy_contracts: ${{ steps.d.outputs.heavy_contracts }}
    steps:
      - id: d
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          FULL: ${{ inputs.full_contracts }}
        run: |
          set -euo pipefail
          run=true
          heavy=false
          if [[ "$EVENT" == "pull_request" && "$DRAFT" == "true" ]]; then
            if [[ ",$LABELS," != *",ci-extended,"* && ",$LABELS," != *",ci-heavy,"* ]]; then
              run=false
            fi
          fi
          if [[ ",$LABELS," == *",ci-extended,"* || ",$LABELS," == *",ci-heavy,"* ]]; then
            heavy=true
          fi
          if [[ "$FULL" == "true" ]]; then
            heavy=true
          fi
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            run=true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "heavy_contracts=$heavy" >> "$GITHUB_OUTPUT"
          echo "decide: run=$run heavy_contracts=$heavy"

  # Dense 3-pack matrix — multi-package cargo per cell (not 8 sparse jobs)
  contracts-core:
    name: contracts (${{ matrix.pack }})
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - pack: contracts-a
          - pack: contracts-b
          - pack: contracts-c
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: contracts-${{ matrix.pack }}
      - name: Dense pack lib tests
        env:
          CI_DENSE_PACK: ${{ matrix.pack }}
          CI_DENSE_MODE: matrix
        run: ./scripts/ci/dense-packs.sh pack "${CI_DENSE_PACK}"
      - name: Wasm check (pack-local subset)
        # Only packages that both need wasm and live in this pack (avoids re-checking all packs).
        run: |
          set -euo pipefail
          case "${{ matrix.pack }}" in
            contracts-a)
              for p in terp-ed25519 terp-passkey terp-vsck; do
                echo "::group::wasm check $p"
                cargo check -p "$p" --target wasm32-unknown-unknown --lib || cargo check -p "$p" --lib
                echo "::endgroup::"
              done
              ;;
            contracts-c)
              for p in cw-ics08-wasm-crosslink; do
                echo "::group::wasm check $p"
                cargo check -p "$p" --target wasm32-unknown-unknown --lib || cargo check -p "$p" --lib
                echo "::endgroup::"
              done
              ;;
            *)
              echo "no wasm subset for ${{ matrix.pack }}"
              ;;
          esac

  # Independent of contracts-core — zk packs are not data-dependent on core contracts
  contracts-heavy:
    name: contracts (zk / optional)
    needs: [should-run]
    if: needs.should-run.outputs.run == 'true' && needs.should-run.outputs.heavy_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: contracts-heavy
      - name: Optional zk-related packages (multi-package dense)
        run: ./scripts/ci/dense-packs.sh contracts-heavy

  scripts-integration:
    name: terp-scripts non-ignored integration
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: scripts-integration
      - uses: extractions/setup-just@v2
      - name: All non-ignored tests in terp-scripts
        run: |
          set -euo pipefail
          # Does not run #[ignore] (Docker harness stays in CI Heavy).
          cargo test -p terp-scripts --lib --tests
