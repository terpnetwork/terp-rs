# rustfmt for terp-scripts. A missing sibling checkout cannot compile the
# path patches, so a GitHub-only checkout stays green. act from the monorepo
# runs the check. A dirty format is a warning, not a failure.
name: rustfmt

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "feat/**"

concurrency:
  group: rustfmt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustfmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.86"
          components: rustfmt

      - name: cargo fmt (terp-scripts)
        run: |
          set -euo pipefail
          if [[ ! -f ../cosmwasm/Cargo.toml ]]; then
            echo "::notice::Path patches need the monorepo checkout. fmt runs under act from crates/terp-rs."
            exit 0
          fi
          if ! cargo fmt -p terp-scripts -- --check; then
            echo "::warning::terp-scripts is not rustfmt-clean."
          fi
