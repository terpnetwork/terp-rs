# Tier 0 — always on. Offline, no Docker, no secrets.
# Goal: exercise terp-scripts agent contracts + lightweight internal libs.
# Dense packing: internal libs run as 2 balanced multi-package matrix packs
# (not one job per crate). Offline IBC pipeline stays serial (data deps).
name: CI Core

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "feat/**"
  workflow_dispatch:

concurrency:
  group: ci-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Checkout root IS the terp-rs repo on GitHub (permissionlessweb/terp-rs).
  # Local act sets GITHUB_WORKSPACE to this crate via scripts/ci (monorepo bind).

jobs:
  # ── Agent IBC offline plane (terp-scripts) — MUST stay serial ──────────
  terp-scripts-offline:
    name: terp-scripts offline (ibc unit/golden + validate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: terp-scripts-offline

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Preflight offline
        run: just scripts-ibc-preflight offline

      - name: Offline IBC tests + rebuild-from-public
        run: just scripts-ibc-offline

      - name: Validate public/ (RunReport JSON)
        run: just scripts-ibc-validate

      - name: Assert validate ok via jq
        run: |
          set -euo pipefail
          cargo run -p terp-scripts --bin terp-ibc --quiet -- validate --format json \
            | tee /tmp/run_report.json
          python3 - <<'PY'
          import json, sys
          r = json.load(open("/tmp/run_report.json"))
          assert r.get("ok") is True, r
          assert r.get("exit_code") == 0, r
          assert r.get("tool") == "terp-ibc", r
          print("RunReport OK:", r.get("verb"), r.get("duration_ms"), "ms")
          PY

  # ── Internal lib crates — dense 2-pack matrix (multi-package cargo) ───
  internal-libs:
    name: internal libs (${{ matrix.pack }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Balanced packs: auth/sdk-ish vs light-client/nips (see docs/ci/dense-parallel-packing.md)
          - pack: core-libs-a
          - pack: core-libs-b
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: internal-libs-${{ matrix.pack }}

      - name: Dense pack lib tests
        env:
          CI_DENSE_PACK: ${{ matrix.pack }}
          CI_DENSE_MODE: matrix
        run: ./scripts/ci/dense-packs.sh pack "${CI_DENSE_PACK}"

  # ── Gate: offline + all lib packs must pass ───────────────────────────
  core-gate:
    name: core gate
    runs-on: ubuntu-latest
    needs: [terp-scripts-offline, internal-libs]
    steps:
      - name: Core CI green
        run: echo "CI Core passed (terp-scripts offline + dense internal lib packs)"
