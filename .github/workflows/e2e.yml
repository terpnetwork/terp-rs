# DEPRECATED launchpad-style e2e. Docker IBC authenticity is CI Heavy → just core scripts-ibc-harness.
name: E2E Integration Tests (deprecated)

on:
  workflow_dispatch:
    inputs:
      acknowledge:
        description: "Type 'use-ci-heavy' to confirm you meant CI Heavy"
        required: true

permissions:
  contents: read

jobs:
  redirect:
    name: use CI Heavy instead
    runs-on: ubuntu-latest
    steps:
      - name: Fail with guidance
        run: |
          echo "This workflow is deprecated (CosmWasm launchpad gas-report e2e)."
          echo "Use: Actions → CI Heavy → Run workflow (Docker multihop harness)."
          echo "Or: just core scripts-ibc-harness"
          if [[ "${{ inputs.acknowledge }}" != "use-ci-heavy" ]]; then
            exit 1
          fi
          exit 1
