# Advisory check. Does not need the sibling path checkouts.
# --hide-inclusion-graph keeps the advisory id, the crate, and the patched
# requirement, and drops the crate tree from the log.
name: cargo-deny

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "feat/**"

concurrency:
  group: cargo-deny-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: Advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Fetch pinned sibling deps (ci/siblings.tsv)
        run: bash ci/fetch-siblings.sh

      # Runs on the runner (not the action's container) so the sibling path deps and the
      # rust-toolchain.toml pin (1.97.1) resolve; the container cannot see ../ or install that toolchain.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version 0.20.2

      - name: cargo-deny advisories
        run: cargo deny --manifest-path Cargo.toml check advisories --hide-inclusion-graph
