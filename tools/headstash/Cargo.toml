zakura-reddsa = { path = "../../../zakura-common/crates/reddsa" }
zakura-sinsemilla = { path = "../../../zakura-common/crates/sinsemilla" }
headstash-randomness = { path = "../../crates/randomness" }
ict-rs = { path = "../../../ict-rs/ict-rs" }
ict-rs-cw-orch = { path = "../../../ict-rs/ict-rs-cw-orch" }
osmosis-std = { path = "../../../osmosis-rust/packages/osmosis-std" }
terp-seams = { path = "../../crates/terp-seams" }
threshold_committee = { path = "../../crates/threshold_committee" }
frost_escrow = { path = "../../crates/frost_escrow" }
# The cw-orchestrator patch table does not apply while this workspace is the root.
cosmwasm-core = { path = "../../../cosmwasm/packages/core" }
cosmwasm-crypto = { path = "../../../cosmwasm/packages/crypto" }
cosmwasm-derive = { path = "../../../cosmwasm/packages/derive" }
