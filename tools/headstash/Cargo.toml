[workspace]
resolver = "2"
members = [
    # Circuit crates were grouped under circuits/ when the set was extended.
    "circuits/halo2",        # zk-headstash
    "circuits/claim-flock",  # headstash-claim
    "wire",                  # headstash-wire
    # Own workspace: rand 0.10 / halo2 must not join the terp-rs lock.
    # Contracts live in the terp-rs root workspace (contracts/headstash).
    "test-press",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aes = "0.8"
anyhow       = "1"
ark-bls12-381 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
base64     = "0.22"
bitvec       = { version = "1", default-features = false }
blake2b_simd = { version = "1", default-features = false }
blake3       = "1"
core3 = { version = "0.1", default-features = false }
cosmwasm-schema = { version = "=4.0.0-zk" }
cosmwasm-std = { version = "=4.0.0-zk" }
cw-headstash = { version = "=0.0.2" }
cw-headstash-manifold = { version = "=0.0.2" }
cw-private-dex = { version = "=0.0.2" }
cw-multi-test = { package = "abstract-cw-multi-test", version = "=3.0.0-rc" }
cw-norick = { version = "0.2.0", features = ["interface"] }
cw-orch = { version = "0.30.0" }
cw-ownable = { version = "3.0.1" }
cw-storage-plus = { version = "3.0.1" }
ff           = "0.14"
fpe = { version = "0.6", default-features = false }
getset      = "0.1"
group        = "0.14"
halo2-base = { version = "0.4.1" }
halo2_gadgets = { package = "zakura-halo2-gadgets", version = "=1.3.0-alpha.1", default-features = false }
halo2_proofs = { package = "zakura-halo2-proofs", version = "=1.3.0-alpha.1", default-features = false, features = ["batch"] }
headstash-randomness = { version = "0.1.0" }
hex        = "0.4"
ict-rs = { version = "0.1.0" }
ict-rs-cw-orch = { version = "0.1.0" }
incrementalmerkletree = { version = "0.8.1", features = ["test-dependencies"] }
lazy_static = "1"
lol_alloc = "0.4.1"
memuse = { version = "0.2", default-features = false }
nonempty = { version = "0.10", default-features = false }
num-bigint   = "0.4"
num-traits   = "0.2"
pasta_curves = { package = "zakura-pasta-curves", version = "=1.3.0-alpha.1", default-features = false, features = ["default"] }
proptest    = ">=1.0.0, <1.7.0"
prost       = "0.14.3"
rand       = { version = "0.10", features = ["std", "sys_rng", "thread_rng"] }
rand_core = "0.10"
rayon      = "1"
reddsa = { package = "zakura-reddsa", version = "=1.3.0-alpha.1", default-features = false, features = ["std"] }
secp256k1    = "0.31"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2        = "0.10"
shardtree = "0.6"
sinsemilla = { package = "zakura-sinsemilla", version = "=1.3.0-alpha.1", default-features = false }
subtle = { version = "2", default-features = false }
terp-seams = { version = "0.1.0" }
threshold_committee = { version = "0.1.0" }
frost_escrow = { version = "0.1.0" }
osmosis-std = { version = "0.26.0" }
env_logger = { version = "0.11", default-features = false }
prost-types = "0.14"
tokio = "1"
thiserror = { version = "2.0.16" }
tracing = { version = "0.1", default-features = false }
visibility  = "0.1"
zcash_note_encryption = { version = "0.4", features = ["pre-zip-212"] }
zcash_spec  = "0.2"
zip32 = { version = "0.2", default-features = false }
zk-cosmwasm = { version = "=4.0.0-zk" }
zk-headstash = { path = "circuits/halo2", default-features = false, features = ["circuit", "std"] }
zk-test-press = { path = "test-press" }

# Crate versions above. Local checkouts replace them here.
[patch.crates-io]
cosmwasm-schema = { path = "../../../cosmwasm/packages/schema" }
cosmwasm-std = { path = "../../../cosmwasm/packages/std" }
zk-cosmwasm = { path = "../../../cosmwasm/packages/zk" }
cw-headstash = { path = "../../contracts/headstash/cw-headstash" }
cw-headstash-manifold = { path = "../../contracts/headstash/manifold" }
cw-private-dex = { path = "../../contracts/revenue/private-dex" }
abstract-cw-multi-test = { path = "../../../cw-multi-test-fork" }
cw-norick = { path = "../../contracts/headstash/no-rick" }
cw-orch = { path = "../../../cw-orchestrator/cw-orch" }
cw-ownable = { path = "../../../cw-plus-plus/packages/ownable" }
cw-storage-plus = { path = "../../../cw-storage-plus" }
