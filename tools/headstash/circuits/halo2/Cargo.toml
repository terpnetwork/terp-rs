[package]
name = "zk-headstash"
version = { workspace = true }
edition = "2021"

[features]
# Host defaults keep prove path; CosmWasm guest (cw-headstash) uses workspace dep with
# default-features=false + features=["circuit","std"] only — no halo2-base/secp C-sys.
default = ["circuit", "multicore", "std", "interface", "host-crypto"]
circuit = ["dep:halo2_gadgets", "dep:halo2_proofs", "std"]
interface = ["std", "circuit", "dep:cw-orch"]
# Host prove/verify: rayon via halo2_proofs::multicore::TryFoldAndReduce.
# Guest wasm (cw-headstash) must leave this off.
multicore = ["halo2_proofs?/multicore", "dep:rayon"]
std = ["core3/std", "group/wnaf-memuse", "reddsa/std"]
# Host-only: libsecp C (breaks wasm32 guest / optimizer). In-crate field, no halo2-base.
host-crypto = ["dep:secp256k1"]
# wasm-bindgen membership prover for the claim page. wasm32-unknown-unknown only;
# no libsecp (host-crypto stays off). Build: tools/headstash/scripts/build-browser-prover.sh
browser = ["circuit", "std", "dep:wasm-bindgen", "dep:getrandom02", "dep:getrandom03", "dep:getrandom04"]
rpc = []
test-dependencies = []
dev-graph = []

[lib]
# cdylib is only consumed by wasm-pack (browser prover); rlib is what dependents link.
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = { workspace = true }
base64  = { workspace = true }
bitvec = { workspace = true, default-features = false }
blake2b_simd = { workspace = true, default-features = false }
blake3  = { workspace = true }
core3 = { workspace = true, default-features = false, features = ["alloc"] }
# No `zk` feature — that injects env.proof_instance_verify host import, which stock
# wasmd / many Terp images do not expose. Guest BridgeMintNote uses pure mock_verify.
cosmwasm-std = { workspace = true }
cw-orch  = { workspace = true, optional = true, features = ["zk", "daemon"] }
ff  = { workspace = true }
fpe = { workspace = true, default-features = false, features = ["alloc"] }
getset = { workspace = true }
group = { workspace = true }
halo2_gadgets  = { workspace = true, optional = true }
halo2_proofs  = { workspace = true, optional = true, features = ["floor-planner-v1-legacy-pdqsort"] }
headstash-randomness  = { workspace = true }
hex = { workspace = true }
incrementalmerkletree = "0.8.1"
lazy_static  = { workspace = true }
memuse = { workspace = true, default-features = false }
nonempty = { workspace = true, default-features = false }
num-bigint  = { workspace = true }
num-traits = { workspace = true }
pasta_curves  = { workspace = true }
proptest = { workspace = true, optional = true }
prost = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
rayon  = { workspace = true, optional = true }
reddsa = { workspace = true, default-features = false }
secp256k1  = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] } 
serde_json  = { workspace = true }
sinsemilla = { workspace = true }
subtle = { workspace = true, default-features = false }
tracing = { workspace = true, default-features = false }
visibility = { workspace = true }
zcash_note_encryption = "0.4"
zcash_spec = { workspace = true }
zip32 = { workspace = true, default-features = false }
zk-cosmwasm = { workspace = true }

# Browser prover only. Optional + wasm32-scoped so native builds and the
# cw-headstash guest wasm (which never enables `browser`) are unaffected.
# Each getrandom major in the graph needs its browser backend (0.2 `js`, 0.3/0.4 `wasm_js`).
# rand 0.10 ThreadRng -> getrandom 0.4; wasm_js needs
# RUSTFLAGS='--cfg getrandom_backend="wasm_js"' (set by the build script).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2.122", optional = true }
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"], optional = true }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }

[dev-dependencies]
halo2_gadgets = { workspace = true, features = ["test-dependencies"] }
hex  = { workspace = true }
incrementalmerkletree  = { workspace = true }
proptest  = { workspace = true }
shardtree = { workspace = true }
zcash_note_encryption  = { workspace = true }

[[example]]
name = "curate_keys"
required-features = ["interface", "host-crypto"]

[[example]]
name = "membership_key_com"
required-features = ["circuit", "std"]

[[example]]
name = "prove_note_witness"
required-features = ["circuit", "std"]
