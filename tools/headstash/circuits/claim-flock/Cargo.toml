[package]
name = "headstash-claim"
description = "Headstash claim circuit: Blake3 inclusion and a derived nullifier, proved with Flock Ligerito."
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"

[dependencies]
bincode = "1.3"
flock-core = { path = "../../../../../flock/crates/flock-core" }
flock-hash = { path = "../../../../../flock/crates/flock-hash" }
flock-prover = { path = "../../../../../flock/crates/flock-prover" }
headstash-wire = { path = "../../wire" }

[dev-dependencies]
serde_json = "1"

[[bench]]
name = "headstash_claim"
harness = false

[[bin]]
name = "depth16_bench"
path = "src/bin/depth16_bench.rs"
