[package]
name = "zk-test-press"
version = { workspace = true }
edition = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "corridor_ict_funded"
path = "src/bin/corridor_ict_funded.rs"
required-features = ["ict-daemon", "seams-escrow"]

# No-Rick circuit + contract → Terp public testnet (120u-1) or CHAIN=local
[[bin]]
name = "deploy_norick_testnet"
path = "src/bin/deploy_norick_testnet.rs"
required-features = ["interface", "zk"]

# Off by default (feature `legacy-notes-gen`): targets HeadstashCircuitSuite
# note/tree generators that zk-headstash no longer provides.
[[bin]]
name = "gen_headstash_notes"
path = "src/bin/gen_headstash_notes.rs"
required-features = ["interface", "legacy-notes-gen"]

# Private DEX + tokenfactory seed denoms → testnet (lab mock_verify settle)
[[bin]]
name = "deploy_private_dex_testnet"
path = "src/bin/deploy_private_dex_testnet.rs"
required-features = ["interface"]

[features]
default = ["interface", "zk", "l0-seams"]
library = []
interface = [
    "dep:ict-rs",
    "dep:cw-headstash",
    "dep:cw-headstash-manifold",
    "cw-private-dex/interface",
    "dep:cw-orch",
    "dep:cw-norick",
]
zk = ["cosmwasm-std/zk", "cw-orch/zk"]
l0-seams = []
# Off by default: the escrow / omni-LP / Option D harnesses target
# `terp_seams::dex` APIs (ThresholdEscrowAuth, authorize_escrow_release,
# DualHomePrepV0, LpSeed*, ...) that terp-seams does not provide yet.
# Enabling this does not compile until those land.
seams-escrow = []
# Off by default: the private_bridge Mock tests need cw-orch's `Mock` to
# implement `ZkTxHandler`, which it does not yet.
mock-zk-tx = []
# Off by default: tests/claim_clearnet.rs predates the current
# register_test_circuit (VerificationError), rand 0.10 (no OsRng) and
# HeadstashCircuitSuite APIs and does not compile.
claim-clearnet = []
# Off by default: src/bin/gen_headstash_notes.rs calls
# HeadstashCircuitSuite::{create_headstash_notes, gen_headstash_tree} and
# zk_headstash::suite::suite, which no longer exist, and does not compile.
legacy-notes-gen = []
# Live HTTP PUT/GET against hash-market notes_base.
note-http = ["l0-seams", "terp-seams/http"]
# L3 Daemon path: ict-rs Docker Terp + ict-rs-cw-orch Daemon + BridgeMintNote.
# Required by `corridor_ict_funded` binary / `just demo-corridor-ict`.
ict-daemon = [
    "interface",
    "dep:ict-rs-cw-orch",
    "dep:tokio",
    "ict-rs/docker",
    "ict-rs/testing",
]

[dependencies]
cosmwasm-std  = { workspace = true }
cw-headstash = { workspace = true, optional = true, features = ["interface", "library", "zk-api"] }
cw-headstash-manifold = { workspace = true, optional = true, features = ["interface"] }
cw-norick = { workspace = true, optional = true, features = ["interface"] }
cw-orch  = { workspace = true, optional = true, features = ["daemon"] }
cw-private-dex = { workspace = true }
env_logger = { workspace = true, features = ["default"] }
#cw-orch-interchain  = { workspace = true, optional = true, features = ["daemon"] }
ff   = { workspace = true }
frost_escrow = { workspace = true }
group.workspace = true
halo2_gadgets = { workspace = true }
halo2_proofs  = { workspace = true, features = ["multicore"] }
headstash-randomness  = { workspace = true }
hex  = { workspace = true }
ict-rs = { workspace = true, optional = true, features = ["terp"] }
ict-rs-cw-orch = { workspace = true, optional = true }
osmosis-std = { workspace = true }
pasta_curves  = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand010 = { workspace = true, features = ["std", "sys_rng", "thread_rng"] }
serde  = { workspace = true }
serde_json  = { workspace = true }
sha2 = { workspace = true }
sinsemilla  = { workspace = true }
terp-seams = { workspace = true, features = ["dex"] }
thiserror = { workspace = true }
threshold_committee = { workspace = true }
tokio = { workspace = true, features = ["full"], optional = true }
zk-cosmwasm  = { workspace = true }
zk-headstash = { workspace = true, features = ["host-crypto", "interface", "multicore"] }

[dev-dependencies]
# ict-rs re-exports its Docker runtime types (DockerConfig, bollard) from the
# prelude, so dev targets that use the interface harness need the docker backend.
ict-rs = { workspace = true, features = ["terp", "docker"] }

[[test]]
name = "claim_clearnet"
path = "tests/claim_clearnet.rs"
required-features = ["interface", "zk", "claim-clearnet"]
