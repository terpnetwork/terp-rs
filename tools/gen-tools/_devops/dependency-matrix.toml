# dependency-matrix.toml — source of truth for forked crate resolution
# Healed by dep tooling: paths are monorepo-relative to REPO_ROOT.
# Do not store absolute paths. Package names must match Cargo.toml [package].name.

[defaults]
# CosmWasm-aligned product line (see _devops/BRANCHING.md). No freeze labels.
git_branch = "v3.1.0-zk.0"
zk_git_branch = "v3.1.0-zk.0"

[crates.abstract]
description = "Abstract monorepo (framework, modules, integrations, interchain)"
local = "abstract/framework"
zk_local = "abstract/framework"
repo_only = true

[crates.abstract.git]
url = "https://github.com/permissionlessweb/abstract"
branch = "v3.1.0-zk.0"

[crates.abstract-cw-plus]
description = "AbstractSDK's cw-plus fork with orchestrator interfaces"
local = "abstract-cw-plus"
zk_local = "abstract-cw-plus"
repo_only = true

[crates.abstract-cw-plus.git]
url = "https://github.com/permissionlessweb/abstract-cw-plus"
branch = "cw3"

[crates.abstract-interface]
description = "Abstract SDK contract interface definitions"
local = "abstract/framework/packages/abstract-interface"
zk_local = "abstract/framework/packages/abstract-interface"
consumers = ["terp-rs"]

[crates.abstract-interface.git]
url = "https://github.com/permissionlessweb/abstract"
branch = "v3.1.0-zk.0"

[crates.abstract-interface.zk_git]
url = "https://github.com/permissionlessweb/abstract"
branch = "v3.1.0-zk.0"

[crates.abstract-std]
description = "Abstract SDK standard library"
local = "abstract/framework/packages/abstract-std"
zk_local = "abstract/framework/packages/abstract-std"
consumers = ["terp-rs"]

[crates.abstract-std.git]
url = "https://github.com/permissionlessweb/abstract"
branch = "v3.1.0-zk.0"

[crates.abstract-std.zk_git]
url = "https://github.com/permissionlessweb/abstract"
branch = "v3.1.0-zk.0"

