[package]
name = "gen-api"
version = "0.1.0"
edition.workspace = true
description = "Terp Network API client library generator — invokes gen-tools pipeline across all CosmWasm workspaces"

[[bin]]
name = "gen-api"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
env_logger = { workspace = true, features = ["default"] }
gen-tools = { workspace = true }
log = { workspace = true }
