[package]
name = "gen-tools"
version = "0.1.0"
edition.workspace = true
description = "Unified Rust runtime for CosmWasm contract type generation: schema, TS-codegen, proto, Python, Zod, Go, Trailmark, OpenAPI, README docs"

[lib]
name = "gen_tools"
path = "src/lib.rs"

[[bin]]
name = "gen-tools"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
env_logger = { workspace = true, features = ["default"] }
glob = { workspace = true }
log = { workspace = true }
pathdiff = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
tera = { workspace = true }
toml = { workspace = true }
walkdir = { workspace = true }
