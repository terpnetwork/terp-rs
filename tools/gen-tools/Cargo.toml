[package]
name = "gen-tools"
version = "0.1.0"
edition = "2024"
description = "Unified Rust runtime for CosmWasm contract type generation: schema, TS-codegen, proto, Python, Zod, Go, Trailmark, OpenAPI, README docs"

[lib]
name = "gen_tools"
path = "src/lib.rs"

[[bin]]
name = "gen-tools"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
glob = "0.3"
log = "0.4"
pathdiff = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
tera = "1" 
toml = "0.8"
walkdir = "2"
