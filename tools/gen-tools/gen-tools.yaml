# ── gen-tools.yaml — Terp Network contract type generation config ────────
#
# Each project is a CosmWasm workspace within the terp-core monorepo.
# Run:   gen-tools --config gen-tools.yaml --all
# Or:    gen-tools --config gen-tools.yaml --project <name>
#
# base_path resolves from the directory this file lives in
# (crates/terp-rs/tools/gen-tools/) up to the monorepo root (4 levels up).
#
# Contract clients land in crates/terp-rs/api/<lang>/<contract>/.
# TypeScript variants are subfolders: api/ts/<contract>/{zod,esbundles,types,client,...}.
# Chain (terp-core module) clients land in api/<lang>/terp-<lang>/.
# TZ outputs go to api/tz/.
#
# cw-infuser / cw721-svg / whitelist-mtree / hm-nft-minter live in
# crates/terp-rs/contracts/infuser (not the leftover isolated crates/cw-infuser
# worktree). Generated TS is crates/terp-rs/api/ts/<contract>/.

base_path: "../../../.."

projects:

  - name: dao-contracts
    path: "crates/dao-contracts"
    proto_modules: "terp,cosmwasm,cosmos,ibc"
    tz_heuristics: "../terp-rs/tools/gen-tools/tz-heuristics.toml"
    tz_episodes_dir: "../terp-rs/tools/gen-tools/tz-episodes"
    tz_recipes_dir: "../terp-rs/tools/gen-tools/tz-recipes"
    tz_profiles_dir: "../terp-rs/tools/gen-tools/tz-profiles"
    tz_out: "api/tz"

  - name: abstract
    path: "crates/abstract/framework"
    tz_heuristics: "../../terp-rs/tools/gen-tools/tz-heuristics.toml"
    tz_episodes_dir: "../../terp-rs/tools/gen-tools/tz-episodes"
    tz_recipes_dir: "../../terp-rs/tools/gen-tools/tz-recipes"
    tz_profiles_dir: "../../terp-rs/tools/gen-tools/tz-profiles"
    tz_out: "api/tz"

  # Unified contract workspace. Clients land in crates/terp-rs/api/<lang>/<contract>/.
  # Invoke with `just gen api` from the terp-rs root.
  # Every workspace member with src/bin/schema.rs or examples/schema.rs is picked up.
  # A cdylib that depends on cosmwasm-std and has neither file fails the schema step.
  # Library crates are skipped. Do not add a per-contract list here.
  - name: terp-rs
    path: "crates/terp-rs"
    steps: "schema,ts-codegen,ts-bundles,python,zod,go,openapi,proto,rust"
    ts_out: "api/ts"
    py_out: "api/python"
    zod_out: "api/ts"
    proto_out: "api/proto"
    go_out: "api/go"
    rust_out: "api/rust"
    openapi_out: "api/openapi"

  - name: polytone
    path: "crates/polytone"
    tz_heuristics: "../terp-rs/tools/gen-tools/tz-heuristics.toml"
    tz_episodes_dir: "../terp-rs/tools/gen-tools/tz-episodes"
    tz_recipes_dir: "../terp-rs/tools/gen-tools/tz-recipes"
    tz_profiles_dir: "../terp-rs/tools/gen-tools/tz-profiles"
    tz_out: "api/tz"

  - name: cw-ica-controller
    path: "crates/cw-ica-controller"
    tz_heuristics: "../terp-rs/tools/gen-tools/tz-heuristics.toml"
    tz_episodes_dir: "../terp-rs/tools/gen-tools/tz-episodes"
    tz_recipes_dir: "../terp-rs/tools/gen-tools/tz-recipes"
    tz_profiles_dir: "../terp-rs/tools/gen-tools/tz-profiles"
    tz_out: "api/tz"

  - name: akash-deploy-rs
    path: "crates/akash-deploy-rs"
    steps: "proto,python,go"
