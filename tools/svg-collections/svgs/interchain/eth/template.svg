<svg xmlns="http://www.w3.org/2000/svg" width="319.6" height="533.3" viewBox="0 0 319.6 533.3" fill="none">
  <defs>
    <style>
      .facet {
        animation: prism-breath ease-in-out infinite alternate;
      }
      .facet-a  { animation-duration: ${breath-a}s; }   /* cool blue */
      .facet-b  { animation-duration: ${breath-b}s; }   /* soft magenta */
      .facet-c  { animation-duration: ${breath-c}s; }   /* warm coral */
      .facet-d  { animation-duration: ${breath-d}s; }   /* electric cyan */
      .facet-e  { animation-duration: ${breath-e}s; }   /* fresh lime */
      .facet-f  { animation-duration: ${breath-f}s; }   /* golden yellow */

      @keyframes prism-breath {
        from { opacity: 0.93; }
        to   { opacity: 1.00; }
      }
    </style>
  </defs>

  <!-- Facet A – cool blue (original st0) -->
  <path class="facet facet-a" fill="${color-blue}" fill-rule="evenodd" clip-rule="evenodd" d="M159.6,402.5L319.6,302L159.6,533.3V402.5z M183.4,415.6v41.8l51.3-74L183.4,415.6z"/>

  <!-- Facet B – soft magenta (original st1) -->
