  <!-- Facet C – warm coral (original st2) -->
  <path class="facet facet-c" fill="${color-coral}" fill-rule="evenodd" clip-rule="evenodd" d="M159.6,0l159.6,274.6L159.6,375.3V0z M183.1,87.9v244.7l104.2-65.7L183.1,87.9z"/>

  <!-- Facet D – electric cyan (original st3) -->
  <path class="facet facet-d" fill="${color-cyan}" fill-rule="evenodd" clip-rule="evenodd" d="M160.1,402.5L0,302l160.1,231.3V402.5z M136.3,415.6v41.8l-51.3-74L136.3,415.6z"/>

  <!-- Facet E – fresh lime (original st4) -->
  <path class="facet facet-e" fill="${color-lime}" fill-rule="evenodd" clip-rule="evenodd" d="M138.7,196L20.5,262.9l11.7,20.6l118.2-66.9L138.7,196z"/>

  <!-- Facet F – golden yellow (original st5) -->
