[package]
name = "svg-collections"
version = "0.1.0"
edition.workspace = true
publish = false
description = "Off-chain builders for packed-only (SVP1) cw721-svg collections: Marain orb + Symbient ASCII"

[dependencies]
base64 = { workspace = true }
cw-svg = { workspace = true }
cw-svg-pack = { workspace = true }
cw721-svg = { workspace = true, features = ["library"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
