# HashMerchant onboard. mint-grant stays 404. passkey-grant/register-grant proxy to :19090.
# Cloudflare tunnel should send this hostname to nginx :80.
server {
    listen 80;
    # FE default in lib/onboard-client.js is https://hash.terp.network
    server_name onboard.permissionless.money hashmerchant.permissionless.money hash.terp.network;

    location = /onboard/v1/mint-grant {
        default_type application/json;
        return 404 '{"ok":false,"error":"mint grant disabled; registration feegrant only"}';
    }
    location = /v1/mint-grant {
        default_type application/json;
        return 404 '{"ok":false,"error":"mint grant disabled; registration feegrant only"}';
    }

    location / {
        proxy_pass http://127.0.0.1:19090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
