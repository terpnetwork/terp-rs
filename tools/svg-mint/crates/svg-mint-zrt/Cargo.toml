[package]
name = "svg-mint-zrt"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-or-later"
rust-version.workspace = true
description = "Durable Ironwood wallet for the SVG mint desk. Never zec.rocks. Never zcash-devtool."

[lib]
name = "svg_mint_zrt"
path = "src/lib.rs"

[[bin]]
name = "svg-mint-zrt"
path = "src/main.rs"

[features]
# Test-only note credit and local spend commit. The default binary cannot fake a balance or a send.
lab = []

[dependencies]
blake3 = { workspace = true }
getrandom = { workspace = true, features = ["std"] }
hex = { workspace = true }
orchard = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
zcash_address = { workspace = true }
zcash_protocol = { workspace = true }
zip3203 = { workspace = true }
