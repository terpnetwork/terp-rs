[package]
name = "dregg"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-or-later"
rust-version.workspace = true
description = "DREGG cell library for the permissionless SVG mint desk. Checkout, commitments, watch helpers. Not HashMerchant."

[dependencies]
bech32 = { workspace = true, features = ["std"] }
bip39 = { workspace = true }
blake3 = { workspace = true, features = ["std", "pure"] }
curve25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true, features = ["std"] }
hmac = { workspace = true }
k256 = { workspace = true, features = ["arithmetic", "ecdsa"] }
rand = { workspace = true, features = ["std", "thread_rng"] }
ripemd = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
tiny-keccak = { workspace = true, features = ["keccak"] }
zcash_address = { workspace = true }
zcash_protocol = { workspace = true }
