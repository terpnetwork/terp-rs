# Local wasm32 checks only. Published artifacts use Rust 1.91 and the optimizer.
# See docs/wasm-artifacts.md.
# Host imports (db_*, ed25519_*, …) are provided by wasmvm at runtime.
# simd128 stays off: the chain gatekeeper rejects guest SIMD, and Wasmer 7.4.2
# singlepass plus the stack-limiter rewrite rejects some nightly LLVM output.
# `cargo schema` from a contract directory. gen-tools also invokes
# `cargo run --bin schema` / `--example schema` directly.
[alias]
schema = "run --bin schema"

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-arg=--allow-undefined",
    "-C", "target-feature=-simd128",
    # rand 0.10 -> getrandom 0.4 has no wasm32-unknown-unknown backend.
    # "unsupported" links nothing. wasm_js would be a browser import.
    "--cfg", 'getrandom_backend="unsupported"',
]
