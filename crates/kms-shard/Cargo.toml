[package]
name = "kms-shard"
version = "0.1.0"
edition = "2021"
description = "Plane S: FROST-Ed25519 DKG + threshold sign. No WASI. No BLS."
license = "Apache-2.0"
publish = false

[lib]
name = "kms_shard"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "kms-dkg"
path = "src/bin/kms-dkg.rs"

[dependencies]
base64 = { workspace = true }
frost-ed25519 = { workspace = true, features = ["std", "serialization"] }
rand_core = { package = "rand_core", version = "0.6", features = ["getrandom"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["custom"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["std"] }
rand = "0.8"
