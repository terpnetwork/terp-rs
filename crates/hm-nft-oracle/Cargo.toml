[package]
name = "hm-nft-oracle"
version = "0.1.0"
edition = "2021"
authors = ["hard-nett <hardnettt@proton.me>"]
description = "Oracle price bound types, stale policy, and HashMerchant sudo adapters for NFT minters"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
hex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
