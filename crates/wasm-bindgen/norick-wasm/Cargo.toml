[package]
name = "norick-wasm"
version = "0.1.0"
edition = "2024"

# Isolated from terp-rs workspace resolver (halo2 / pasta vs cosmos pins).
# getrandom's js feature is the wasm RNG backend. Nothing imports the crate.
[package.metadata.cargo-machete]
ignored = ["getrandom"]

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
pasta_curves = { package = "zakura-pasta-curves", version = "=5.0.0-rc.3", default-features = false, features = ["default"] }
ff = "0.14"
group = "0.14"
rand = { version = "0.10", default-features = false, features = ["std", "thread_rng"] }
getrandom = { version = "0.2", features = ["js"] }
halo2_proofs = { package = "zakura-halo2-proofs", version = "=5.0.0-rc.3", default-features = false, features = ["batch"] }

[profile.release]
opt-level = "s"
lto = true

[patch.crates-io]


zakura-halo2-proofs = { path = "../../../../zakura-common/crates/halo2_proofs" }
zakura-pasta-curves = { path = "../../../../zakura-common/crates/pasta_curves" }