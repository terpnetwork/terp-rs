[package]
name = "norick-wasm"
version = "0.1.0"
edition = "2024"

# Isolated from terp-rs workspace resolver (halo2 / pasta vs cosmos pins).
# getrandom's js feature is the wasm RNG backend. Nothing imports the crate.
[package.metadata.cargo-machete]
ignored = ["getrandom"]

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
halo2_proofs = { package = "zakura-halo2-proofs", path = "../../../../zakura-common/crates/halo2_proofs", default-features = false, features = ["batch"] }

[profile.release]
opt-level = "s"
lto = true
