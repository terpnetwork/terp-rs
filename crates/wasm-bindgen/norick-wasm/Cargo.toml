[package]
name = "norick-wasm"
version = "0.1.0"
edition = "2021"

# Isolated from terp-rs workspace resolver (halo2 / pasta vs cosmos pins).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
halo2_proofs = { path = "../../../../zcash/halo2/halo2_proofs", package = "halo2_proofs", default-features = false }

[profile.release]
opt-level = "s"
lto = true
