[package]
name = "terp-account"
description = "Terp account domain types + trait re-exports for smart-account authenticators"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
documentation = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[lib]
crate-type = ["rlib"]

[features]
default = ["traits-only"]
# Lightweight path for authenticator crates (no NFT marketplace surface)
traits-only = []
market-hooks = []
manifold = []
# Full NFT/account-token surface (requires cw721 stack)
full = ["dep:cw721", "dep:bech32", "dep:cw-ownable", "dep:cw-controllers", "dep:ripemd"]
abstract = ["full", "dep:abstract-std"]
interface = ["dep:cw-orch"]

[dependencies]
cosmwasm-std = { workspace = true, features = ["zk"] }
cosmwasm-schema = { workspace = true }
terp-auth = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }

# Optional heavy deps for full marketplace package
cw-orch = { workspace = true, optional = true }
cw-ownable = { workspace = true, optional = true }
abstract-std = { workspace = true, optional = true }
cw721 = { workspace = true, optional = true }
bech32 = { workspace = true, optional = true, features = ["alloc"] }
cw-controllers = { workspace = true, optional = true }
ripemd = { workspace = true, optional = true }

[dev-dependencies]
# Host tests verify secp256k1. The guest uses Api::secp256k1_verify.
cosmwasm-crypto = { workspace = true }
ecdsa = { workspace = true }
k256 = { workspace = true, features = ["arithmetic", "ecdsa", "pkcs8", "precomputed-tables", "schnorr", "std"] }