[package]
name = "cw721-nips"
version = "0.1.0"
edition = "2021"
description = "Nostr NIP library with cw721-trait-based metadata system"
license = "MIT"

[features]
default = ["full"]
nip01 = []
nip15 = []
nip52 = []
nip77 = []
nip44 = [
    "dep:rand_core06",
    "dep:hmac",
    "dep:hkdf",
    "dep:constant_time_eq",
    "dep:chacha20",
    "dep:base64",
]
cw = ["dep:cosmwasm-std", "dep:cw721"]
full = ["cw", "nip01", "nip15", "nip52", "nip77"]
# Opt-in Cashu NUT sketches. `nut02` remains a documented stub (no keyset crypto).
nuts = ["nut02"]
nut02 = []

[dependencies]
axum = { workspace = true, features = ["json"] }
# NIP-44 v2
base64 = { workspace = true, optional = true }
chacha20 = { workspace = true, optional = true }
constant_time_eq = { workspace = true, optional = true }
cosmwasm-std = { workspace = true, optional = true, features = ["zk"] }
cw721 = { workspace = true, optional = true }
hex = { workspace = true, features = ["std"] }
hkdf = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
rand_core06 = { workspace = true, optional = true, features = ["getrandom"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
