[package]
name = "hm-loyalty-whitelist"
version = "0.1.0"
edition = "2021"
authors = ["hard-nett <hardnettt@proton.me>"]
description = "HashMerchant loyalty Merkle whitelist codec (hm-loyalty/v1) matching tools/hashmerchant-support/whitelist/build.py"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
hex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
