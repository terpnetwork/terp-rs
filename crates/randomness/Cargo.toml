# Nested under terp-rs but not a member (rand 0.8). Own workspace so cargo
# commands that follow the path dependency can load this manifest.
[workspace]

[package]
name = "headstash-randomness"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
blake3 = "1.5"
rand = { version = "0.8", features = ["std"] }
rand_core = "0.6"
#rdrand = "0.8"           # for hardware RNG
getrandom = { version = "0.2", features = ["std"] } # ensure strong backend