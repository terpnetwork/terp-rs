[package]
name = "terp-seams"
version = "0.1.0"
edition = "2021"
description = "Unified L0 seams: private DEX, bridge mint, Cash App→ZEC corridor, compose glue, domain tags"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["dex", "bridge", "corridor", "compose"]
dex = []
bridge = []
corridor = []
compose = ["dex", "bridge"]
http = ["dep:reqwest"]
auth = ["dep:k256"]
cli = ["http", "auth", "dep:clap"]

[[bin]]
name = "headstash-notes"
path = "src/bin/headstash_notes.rs"
required-features = ["cli"]

[dependencies]
sha2 = "0.10"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
k256 = { version = "0.13", features = ["ecdsa", "sha256"], optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
