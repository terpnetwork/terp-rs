[package]
name = "discord-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = "0.6"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "cache"] }
tokio = { version = "1.40", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = { package = "dotenvy", version = "0.15" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
githem-core = "0.4"
html2text = "0.14"
futures = "0.3"
# Small pure-Rust crypto for Tendermint address derivation
# (consensus pubkey -> valcons address for missed-block attribution).
sha2 = "0.10"
# Mandatory: the RLM loop has no in-process eval path. Generated code runs
# ONLY as a network-less WASIX guest via this SDK.
wasmer-sdk = { path = "../../../../../wasmer-sdk/rust" }
base64 = "0.22"

# Mirror crates/wasmer-sdk's pins: wasmer-sdk expects the wasmer 7.4.0 /
# wasix 0.704.0 git tree. [patch] tables in non-root crates are ignored by
# cargo, so the root crate must repeat them for the build to match.
[patch.crates-io]
virtual-fs = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }
virtual-mio = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }
virtual-net = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }
wasmer = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }
wasmer-c-api-imports = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }
wasmer-config = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }
wasmer-package = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }
wasmer-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }
wasmer-wasix = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }
wasmer-wasix-types = { git = "https://github.com/wasmerio/wasmer.git", rev = "7399a23f73d75d290010f9b9b601e2e5cc37ff23" }

# Own workspace so this bot is not pulled into the terp-rs contract workspace.
[workspace]
