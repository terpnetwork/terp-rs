# groot2 nginx: LAN ingress to local OpenCode serve.
# OpenCode itself binds 127.0.0.1:4096 (not WAN). Edgar talks to this
# 192.168.10.101:4097 front, same pattern as LCD on :1317.
#
# allow 192.168.10.0/24 + loopback only.
#
#   sudo cp deploy/nginx-opencode.groot2.conf /etc/nginx/sites-enabled/opencode-rlm.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 192.168.10.101:4097;
    listen 127.0.0.1:4097;
    server_name opencode.lab g2-opencode.terp.network _;

    allow 127.0.0.1;
    allow 192.168.10.0/24;
    deny all;

    client_max_body_size 4m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:4096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
