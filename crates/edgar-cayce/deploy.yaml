---
# Edgar Discord Bot — Akash SDL
# ═══════════════════════════════════════════════════════════════════════════════
# Build & push before deploying:
#   docker build -t <your-registry>/edgar:0.1.0 .
#   docker push <your-registry>/edgar:0.1.0
# Then update the image field below.
# ═══════════════════════════════════════════════════════════════════════════════
version: "2.0"

services:
  edgar:
    image: permissionlessweb/edgar-cayce:0.0.1
    env:
      # ── Discord ──────────────────────────────────────────────────────────────
      - "DISCORD_TOKEN="                  # REQUIRED — bot token from dev portal
      - "DISCORD_GUILD_ID="               # guild ID for instant slash-command registration
      - "ADMIN_USER_IDS="                 # comma-separated Discord user IDs (admin-only mutations)
      - "ADMIN_ROLE_IDS="                 # comma-separated admin role IDs
      # ── LLM endpoint (OpenAI-compatible) ─────────────────────────────────────
      - "LLM_BASE_URL=https://api.openai.com/v1"
      - "LLM_MODEL=Qwen/Qwen2.5-Coder-7B-Instruct"
      - "LLM_SUB_MODEL=Qwen/Qwen2.5-Coder-7B-Instruct"
      - "LLM_API_KEY="
      # ── Terp engine ──────────────────────────────────────────────────────────
      # RLM code runs ONLY in a network-less WASIX guest (no opt-out).
      - "TERP_SYNC_ROOT="                 # REQUIRED for /edgar ingest-local; never "."
      - "TERP_NODE_REST="                 # read-only LCD for node_query + validator/gov cmds
      - "WASMER_PYTHON_PACKAGE=python/python"  # pin a version for reproducibility
      - "DAO_CONTRACT="                   # foundation DAO core; not hard-coded
      - "DAO_ALLOWLIST="                  # extra subDAO cores, comma-separated
      - "DAO_NOTIFY_CHANNEL_ID="          # governance posts; loop stays off if empty
      - "DAO_POLL_SECS=60"
      - "DAO_CHAIN_ID="
      - "DAO_UI_BASE=https://daodao.zone"
      - "DAO_INCLUDE_SUBDAOS=true"
      - "SPAM_NOTIFY_CHANNEL_ID="         # delete+notify only; no timeouts implemented
      # ── Runtime ──────────────────────────────────────────────────────────────
      - "RUST_LOG=info"
    expose:
      # Discord Gateway — outbound WSS :443 is unrestricted on Akash.
      # This port is exposed for health checks / future metrics endpoint.
      - port: 8080
        as: 80
        to:
          - global: true

profiles:
  compute:
    edgar:
      resources:
        cpu:
          units: 2
        memory:
          size: 2Gi
        storage:
          - size: 1Gi            # ephemeral (OS + binary)
          - size: 100Gi          # persistent — sqlite document store
            attributes:
              persistent: true
              class: beta2
  placement:
    akash:
      pricing:
        edgar:
          denom: uakt
          amount: 1000

deployment:
  edgar:
    akash:
      profile: edgar
      count: 1
