[package]
name = "terp-rs"
version = "0.0.2"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["ibc"]
ibc = [
    #"dep:ibc-types",
    #"dep:ibc-app-transfer-types",
    #"dep:ibc-app-nft-transfer-types",
    #"dep:ibc-client-wasm-types",
]
rpc = ["dep:tonic", "dep:tonic-prost"]
python = ["dep:pyo3", "dep:serde_json"]

# ---------------------------------------------------------------------------
# Dependencies used by the proto-gen binary
# ---------------------------------------------------------------------------
[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
# ibc-app-nft-transfer-types = { path = "../../../ibc-rs/ibc-apps/ics721-nft-transfer/types", optional = true, default-features = false }
# ibc-app-transfer-types = { path = "../../../ibc-rs/ibc-apps/ics20-transfer/types", optional = true, default-features = false, features = []  }
# ibc-client-wasm-types = { path = "../../../ibc-rs/ibc-clients/ics08-wasm/types", optional = true, default-features = false }
ibc-proto = { workspace = true }
# ibc-types = { path = "../../../ibc-types/crates/ibc-types", features = [], optional = true }
pbjson-types = { workspace = true }

# ---------------------------------------------------------------------------
# Runtime dependencies for the generated library types
# ---------------------------------------------------------------------------
prost = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }

# Optional: Python bindings (enabled with the `python` feature).
pyo3 = { workspace = true, optional = true, features = ["extension-module"] }
serde_json = { workspace = true, optional = true, features = ["std"] }
tonic = { workspace = true, optional = true }
tonic-prost = { workspace = true, optional = true }
