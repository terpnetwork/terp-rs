[package]
name = "crosslink-light-client"
version = "0.1.0"
edition = { workspace = true }
repository = { workspace = true }
description = "Core light client verification primitives for Zcash Crosslink TFL"

[features]
# Optional invariance tests against a local zebra-crosslink checkout.
zebra-crosslink-compare = ["dep:zebra-crosslink", "dep:zebra-chain"]

[dependencies]
byteorder = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
zebra-chain = { workspace = true, optional = true }
# Compare tests only. Cargo rejects optional dev-dependencies, and these
# crates do not build in this workspace (zcash_transparent secp256k1 split).
zebra-crosslink = { workspace = true, optional = true }
