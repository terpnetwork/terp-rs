[package]
name = "crosslink-light-client"
version = "0.1.0"
edition = { workspace = true }
repository = { workspace = true }
description = "Core light client verification primitives for Zcash Crosslink TFL"

[features]
# Optional invariance tests against a local zebra-crosslink checkout.
zebra-crosslink-compare = []

[dependencies]
cosmwasm-std = { workspace = true, features = ["zk"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
hex = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
byteorder = { workspace = true }

[dev-dependencies]
# Full zebra-crosslink crate imported ONLY for type invariance tests
zebra-crosslink = { workspace = true }
zebra-chain = { workspace = true }