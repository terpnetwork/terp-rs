# Own workspace. Cold signer for the kms bluetooth backend.
[workspace]

[package]
name = "zafu"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline consensus signer. The key stays here."

[dependencies]
chacha20poly1305 = "0.10"
ed25519-zebra = { version = "4.2", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
