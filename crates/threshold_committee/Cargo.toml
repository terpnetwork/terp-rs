[package]
name = "threshold_committee"
version = "0.1.0"
edition = "2024"
description = "In-house t-of-n committee threshold signing for hashmerchant VE and escrow release (lab multi-sig; no external MPC runtime)"
publish = false
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
# `lab`: OS-entropy key generation (LabCommittee::generate). Off for wasm
# contracts, which only decode TC01 rosters / combined signatures.
default = ["lab"]
lab = ["dep:rand_core06"]

[dependencies]
hex = { workspace = true, features = ["std"] }
k256 = { workspace = true, features = ["ecdsa", "sha256", "std"] }
rand_core06 = { workspace = true, features = ["getrandom"], optional = true }
sha2 = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
