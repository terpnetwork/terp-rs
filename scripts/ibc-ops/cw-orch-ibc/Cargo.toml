[package]
name = "cw-orch-ibc"
version = "0.1.0"
edition = "2021"
publish = false
description = "cw-orch DAO scripting: native delegations + FIAB-SUBDAO"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cosmwasm-std = { path = "../../../../cosmwasm/packages/std", features = ["staking", "stargate", "cosmwasm_2_2"] }
cw-utils = { path = "../../../../cw-minus/packages/cw-utils" }
cw4 = { path = "../../../../cw-plus/packages/cw4" }
dao-interface = { path = "../../../../dao-contracts/packages/dao-interface" }
dao-proposal-single = { path = "../../../../dao-contracts/contracts/proposal/dao-proposal-single" }
dao-voting = { path = "../../../../dao-contracts/packages/dao-voting" }
dao-voting-cw4 = { path = "../../../../dao-contracts/contracts/voting/dao-voting-cw4" }

[dev-dependencies]
cw-multi-test = { package = "abstract-cw-multi-test", path = "../../../../cw-multi-test-fork" }
cw-utils = { path = "../../../../cw-minus/packages/cw-utils" }
cw4 = { path = "../../../../cw-plus/packages/cw4" }
cw4-group = { path = "../../../../cw-plus/contracts/cw4-group" }
dao-dao-core = { path = "../../../../dao-contracts/contracts/dao-dao-core" }
dao-voting-cw4 = { path = "../../../../dao-contracts/contracts/voting/dao-voting-cw4" }
dao-pre-propose-single = { path = "../../../../dao-contracts/contracts/pre-propose/dao-pre-propose-single" }

[[bin]]
name = "foundation_delegate"
path = "src/bin/foundation_delegate.rs"

[patch.crates-io]
cosmwasm-std = { path = "../../../../cosmwasm/packages/std" }
