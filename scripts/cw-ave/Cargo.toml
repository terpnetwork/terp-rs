[package]
name = "cw-ave-scripts"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cw-ave-deploy"
path = "src/bin/deploy.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
av-event-helpers = { workspace = true }
clap = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
cw-ave = { workspace = true }
cw-ave-factory = { workspace = true }
cw-orch = { workspace = true, features = ["daemon"] }
cw4 = { workspace = true }
cw420 = { workspace = true }
dotenv = { workspace = true }
env_logger = { workspace = true }
serde_json  = { workspace = true }

[dev-dependencies]
k256 = { workspace = true, features = ["ecdsa", "std"] }
 
 
