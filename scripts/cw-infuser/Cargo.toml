[package]
name = "cw-infuser-scripts"
version = "0.1.0"
edition = "2021"

[features]
default = ["e2e"]
e2e = ["dep:tokio", "dep:tracing"]
# Pulls shitstrap's interchain scripts (Hermes, local alloy). Off for the
# terp-orch infuser bag; turn on for the deploy binary.
shitstrap = ["dep:cw-shitstrap", "dep:shit-scripts"]

[[bin]]
name = "deploy"
required-features = ["shitstrap"]

[[bin]]
name = "multichain_e2e"
required-features = ["shitstrap", "e2e"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/manifest.html

[dependencies]
anyhow = "1.0.79"
bech32 = "0.11"
blake3 = "1.8.3"
clap = { version = "4.5.23", features = ["derive", "env"] }
cosmwasm-std = { workspace = true }
csv = "1.3"
cw-infuser = { workspace = true, features = ["interface"] }
cw-infusions = { workspace = true }
cw-orch = { workspace = true, features = ["daemon"] }
cw-shitstrap = { path = "../../../shitstrap/contracts/cw-shitstrap", features = ["interface"], optional = true }
cw-svg = { workspace = true }
cw-svg-minter = { workspace = true, features = ["interface"] }
cw721 = { workspace = true }
cw721-svg = { workspace = true, features = ["interface"] }
dotenv = "0.15.0"
env_logger = { version = "0.11.3", default-features = false }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
rand = { version = "0.8.5", features = ["std_rng"] }
rs_merkle = { version = "1.4.1", default-features = false }
serde = { workspace = true }
serde_json = "1.0"
sha2 = "0.10"
shit-scripts = { path = "../../../shitstrap/scripts", optional = true }
shlex = "1.3.0"

# e2e multichain test deps
tokio = { version = "1", features = ["full"], optional = true }
tracing = { version = "0.1", optional = true }
ureq = "2"
whitelist-mtree = { workspace = true, features = ["interface"] }
