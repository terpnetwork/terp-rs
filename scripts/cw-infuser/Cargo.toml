[package]
name = "cw-infuser-scripts"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "deploy"
required-features = ["shitstrap"]

[[bin]]
name = "multichain_e2e"
required-features = ["shitstrap", "e2e"]

[[bin]]
name = "upload"
# uses cw_infuser_scripts::suite (shitstrap-gated)
required-features = ["shitstrap"]

[[bin]]
name = "create_infusion_minter"
# uses cw_infuser_scripts::suite (shitstrap-gated)
required-features = ["shitstrap"]

[[bin]]
name = "yijing_harmony"
# uses cw_infuser_scripts::suite (shitstrap-gated)
required-features = ["shitstrap"]

[features]
default = ["e2e"]
e2e = ["dep:tokio", "dep:tracing"]
# Pulls shitstrap's interchain scripts (Hermes, local alloy). Off for the
# terp-orch infuser bag; turn on for the deploy binary.
shitstrap = ["dep:cw-shitstrap", "dep:terp-orch"]

[dependencies]
anyhow = { workspace = true }
bech32 = { workspace = true, features = ["std"] }
blake3 = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
cosmrs = { workspace = true }
cosmwasm-std = { workspace = true, features = ["zk"] }
csv = "1.3"
cw-infuser = { workspace = true, features = ["interface"] }
cw-infusions = { workspace = true }
cw-orch = { workspace = true, features = ["daemon"] }
cw-shitstrap = { workspace = true, features = ["interface"], optional = true }
cw-svg = { workspace = true }
cw-svg-minter = { workspace = true, features = ["interface"] }
cw721 = { workspace = true }
cw721-svg = { workspace = true, features = ["interface"] }
dotenv = { workspace = true }
env_logger = { workspace = true }
hex = { workspace = true, features = ["std"] }
k256 = { workspace = true, features = ["ecdsa", "std"] }
rand = { version = "0.8.5", features = ["std_rng"] }
rs_merkle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
shlex = "1.3.0"
svg-collections = { path = "../../tools/svg-collections" }
terp-orch = { workspace = true, features = ["stack"], optional = true }

# e2e multichain test deps
tokio = { version = "1", features = ["full"], optional = true }
tracing = { version = "0.1", optional = true }
ureq = "2"
whitelist-mtree = { workspace = true, features = ["interface"] }

[dev-dependencies]
prost = { workspace = true }
terp-rs = { workspace = true }
